<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户管理 - CRM</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <style>
    .toolbar { padding: 16px; }
    .filter-grid { display: grid; grid-template-columns: auto 1fr auto 1fr auto 1fr; gap: 12px 8px; align-items: center; }
    .filter-grid label { font-size: var(--fs-sm); color: var(--text); text-align: right; white-space: nowrap; }
    .filter-grid input, .filter-grid select { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .filter-actions { display: flex; justify-content: flex-end; gap: 8px; grid-column: 5 / 7; }
    .btn-md { height: 32px; padding: 0 14px; font-size: var(--fs-sm); }
    .list-card { overflow: auto; }
    .list-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .list-head h3 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
    .list-head .count { color: var(--text-secondary); font-size: var(--fs-xs); font-weight: 400; margin-left: 8px; }
    .list-tools { display: flex; gap: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px 8px; text-align: left; border-top: 1px solid #f0f0f0; white-space: nowrap; }
    th { background: #fafafa; color: var(--text-secondary); font-weight: 600; }
    .link { border: 0; background: none; color: #fa8c16; cursor: pointer; font-size: 12px; padding: 0; }
    .st { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .st-deal { background: #f6ffed; color: #389e0d; }
    .st-intent { background: #e6f4ff; color: var(--primary); }
    .st-potential { background: #f0f5ff; color: #597ef7; }
    .st-churn { background: #fff1f0; color: var(--danger); }
    .pager-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; font-size: var(--fs-xs); color: var(--text-secondary); }
    .pager-right { display: flex; align-items: center; gap: 8px; }
    .pager-bar button { min-width: 24px; height: 24px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; }
    .pager-bar button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager-bar input { width: 40px; height: 24px; }
    .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: center; justify-content: center; padding: 16px; }
    .mask.show { display: flex; }
    .modal { width: 720px; max-width: 100%; background: #fff; border-radius: var(--radius); max-height: calc(100vh - 24px); overflow: auto; }
    .modal-head { height: 44px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; font-weight: 600; }
    .modal-close { position: absolute; right: 12px; top: 0; bottom: 0; border: 0; background: none; color: #fff; font-size: 18px; cursor: pointer; }
    .modal-body { padding: 18px 22px 8px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 22px 20px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .field label { display: block; font-size: var(--fs-xs); color: var(--text); margin-bottom: 6px; }
    .field input, .field select, .field textarea { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .field textarea { height: 72px; padding: 8px; resize: vertical; }
    .ro { background: #f5f5f5 !important; }
    .full { grid-column: 1 / -1; }
    @media (max-width: 1100px) { .filter-grid { grid-template-columns: auto 1fr auto 1fr; } .filter-actions { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div class="toast-wrap" id="toasts"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">CRM</div>
      <nav class="nav">
        <a class="nav-item" href="workbench.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          工作台
        </a>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16M8 16l3-4 3 2 4-6"/></svg>销售中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="marketing-goals.html">营销目标</a>
            <a class="nav-item" href="leads.html">线索管理</a>
            <a class="nav-item" href="opportunities.html">商机管理</a>
            <a class="nav-item" href="contracts.html">合同管理</a>
            <a class="nav-item active" href="customers.html">客户管理</a>
            <button class="nav-item" data-page="pending" type="button">销售业绩</button>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/></svg>客户中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <button class="nav-item" data-page="pending" type="button">政务服务</button>
            <button class="nav-item" data-page="pending" type="button">代账服务</button>
            <button class="nav-item" data-page="pending" type="button">地址管理</button>
            <button class="nav-item" data-page="pending" type="button">客户物品</button>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>运营中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <button class="nav-item" data-page="pending" type="button">财务报销</button>
            <button class="nav-item" data-page="pending" type="button">经营报表</button>
            <button class="nav-item" data-page="pending" type="button">人事管理</button>
            <button class="nav-item" data-page="pending" type="button">薪资管理</button>
            <button class="nav-item" data-page="pending" type="button">员工管理</button>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/></svg>系统管理</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <button class="nav-item" data-page="pending" type="button">角色权限</button>
            <button class="nav-item" data-page="pending" type="button">字典管理</button>
            <button class="nav-item" data-page="pending" type="button">菜单管理</button>
          </div>
        </div>
      </nav>
    </aside>
    <div class="main">
      <header class="header">
        <div class="dropdown" id="mailDrop">
          <button class="icon-btn" type="button" data-toggle="mailDrop" aria-label="消息"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></button>
          <div class="dropdown-panel"><div class="empty">暂无新消息</div></div>
        </div>
        <button class="icon-btn soon" type="button" aria-label="帮助"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 17v-1M12 8a2.2 2.2 0 0 1 1 4c-.6.5-1 1-1 2"/></svg></button>
        <div class="dropdown" id="userDrop">
          <button class="user-chip" type="button" data-toggle="userDrop"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 19c1-4 3.5-6 7-6s6 2 7 6"/></svg>用户</button>
          <div class="dropdown-panel"><button type="button" class="soon">个人中心</button></div>
        </div>
      </header>
      <main class="content">
        <section class="card toolbar">
          <div class="filter-grid">
            <label>客户/公司名称</label><input id="fName" placeholder="请输入客户或公司名称" />
            <label>联系人</label><input id="fContact" placeholder="请输入联系人姓名" />
            <label>手机号</label><input id="fPhone" placeholder="请输入联系手机号" />
            <label>客户编号</label><input id="fNo" placeholder="请输入客户编号" />
            <label>客户来源</label><select id="fSource"></select>
            <label>客户状态</label><select id="fStatus"></select>
            <div class="filter-actions">
              <button class="btn btn-ghost btn-md" id="btnReset" type="button">重置</button>
              <button class="btn btn-primary btn-md" id="btnQuery" type="button">查询</button>
            </div>
          </div>
        </section>
        <section class="card list-card">
          <div class="list-head">
            <h3>客户列表<span class="count" id="listCount">共 0 条记录</span></h3>
            <div class="list-tools">
              <button class="btn btn-ghost btn-md soon" type="button">导出</button>
              <button class="btn btn-primary btn-md" id="btnCreate" type="button">+ 新增客户</button>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>客户编号</th><th>客户/公司名称</th><th>联系人</th><th>联系手机</th><th>所属区域</th>
                <th>所属行业</th><th>企业形式</th><th>客户来源</th><th>所属业务员</th><th>客户状态</th><th>创建时间</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="pager-bar">
            <span id="pageInfo"></span>
            <div class="pager-right">
              <div id="pages"></div>
              <select id="pageSize"><option>10</option><option>20</option></select> 条/页
              跳至 <input id="jump" /> 页 <button type="button" id="btnJump">跳转</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="mask" id="cuMask">
    <div class="modal">
      <div class="modal-head" id="cuTitle">新增客户<button class="modal-close" data-close="cuMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two">
          <div class="field"><label>客户编号</label><input id="c_no" class="ro" disabled /></div>
          <div class="field"><label>客户/公司名称</label><input id="c_name" placeholder="请输入客户或公司名称" /></div>
          <div class="field"><label>联系人</label><input id="c_contact" placeholder="请输入联系人姓名" /></div>
          <div class="field"><label>联系手机</label><input id="c_phone" placeholder="请输入联系手机号" /></div>
          <div class="field"><label>所属区域</label><input id="c_region" placeholder="如：深圳-南山" /></div>
          <div class="field"><label>所属行业</label><select id="c_ind"></select></div>
          <div class="field"><label>企业形式</label><select id="c_type"></select></div>
          <div class="field"><label>客户来源</label><select id="c_src"></select></div>
          <div class="field"><label>所属业务员</label><select id="c_owner"></select></div>
          <div class="field"><label>客户状态</label><select id="c_st"></select></div>
          <div class="field full"><label>详细地址</label><input id="c_addr" placeholder="请输入详细地址（选填）" /></div>
          <div class="field full"><label>备注</label><textarea id="c_note" placeholder="请输入备注信息（选填）"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="cuMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="cuOk" type="button">确认新增</button>
      </div>
    </div>
  </div>

  <script src="js/crm-store.js"></script>
  <script>
    const toast = (m) => { const el = document.createElement("div"); el.className = "toast"; el.textContent = m; document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 1800); };
    document.querySelectorAll(".nav-group-btn").forEach((b) => b.addEventListener("click", () => b.parentElement.classList.toggle("open")));
    document.querySelectorAll("[data-page=pending],.soon").forEach((el) => el.addEventListener("click", () => toast("功能即将开放")));
    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); document.querySelectorAll(".dropdown").forEach((d) => d.classList.toggle("open", d.id === btn.dataset.toggle && !d.classList.contains("open"))); });
    });
    document.addEventListener("click", () => document.querySelectorAll(".dropdown").forEach((d) => d.classList.remove("open")));
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => document.getElementById(b.dataset.close).classList.remove("show")));

    const $ = (id) => document.getElementById(id);
    const fillSel = (el, list, all) => { el.innerHTML = `<option value="">${all}</option>` + list.map((x) => `<option value="${x.id}">${x.name}</option>`).join(""); };
    fillSel($("fSource"), CRM.dicts.sources, "请选择");
    fillSel($("fStatus"), CRM.dicts.customerStatuses, "请选择");
    fillSel($("c_ind"), CRM.dicts.industries, "请选择");
    fillSel($("c_type"), CRM.dicts.companyTypes, "请选择");
    fillSel($("c_src"), CRM.dicts.sources, "请选择");
    fillSel($("c_owner"), CRM.dicts.people, "请选择");
    fillSel($("c_st"), CRM.dicts.customerStatuses, "请选择");

    let list = CRM.loadCustomers();
    let page = 1;
    let query = {};
    let mode = "create";
    let editingId = null;

    const filtered = () => list.filter((c) => {
      if (query.name && !(c.name || "").includes(query.name)) return false;
      if (query.contact && !(c.contact || "").includes(query.contact)) return false;
      if (query.phone && !(c.phone || "").includes(query.phone)) return false;
      if (query.no && !(c.no || "").includes(query.no)) return false;
      if (query.source && c.sourceId !== query.source) return false;
      if (query.status && c.statusId !== query.status) return false;
      return true;
    });

    const render = () => {
      const rows = filtered();
      const size = Number($("pageSize").value);
      const pages = Math.max(1, Math.ceil(rows.length / size));
      if (page > pages) page = pages;
      $("listCount").textContent = `共 ${rows.length} 条记录`;
      $("pageInfo").textContent = `共 ${rows.length} 条记录`;
      $("tbody").innerHTML = rows.slice((page - 1) * size, page * size).map((c) => `<tr>
        <td>${c.no}</td>
        <td>${c.name || "—"}</td>
        <td>${c.contact || "—"}</td>
        <td>${c.phone || "—"}</td>
        <td>${c.region || "—"}</td>
        <td>${CRM.dictName("industries", c.industryId)}</td>
        <td>${CRM.dictName("companyTypes", c.companyTypeId)}</td>
        <td>${CRM.dictName("sources", c.sourceId)}</td>
        <td>${(CRM.person(c.ownerId) || {}).name || "—"}</td>
        <td><span class="st st-${c.statusId}">${CRM.dictName("customerStatuses", c.statusId)}</span></td>
        <td>${c.createdAt || "—"}</td>
        <td><button class="link" data-id="${c.id}" type="button">编辑</button></td>
      </tr>`).join("") || `<tr><td colspan="12">暂无客户</td></tr>`;
      $("pages").innerHTML = Array.from({ length: pages }, (_, i) => `<button class="${i + 1 === page ? "on" : ""}" data-p="${i + 1}" type="button">${i + 1}</button>`).join("");
    };

    const openCreate = () => {
      mode = "create"; editingId = null;
      $("cuTitle").textContent = "新增客户";
      $("cuOk").textContent = "确认新增";
      $("c_no").value = CRM.nextCustomerNo(list);
      $("c_name").value = $("c_contact").value = $("c_phone").value = $("c_region").value = $("c_addr").value = $("c_note").value = "";
      $("c_ind").value = $("c_type").value = $("c_src").value = $("c_owner").value = "";
      $("c_st").value = "potential";
      $("cuMask").classList.add("show");
    };

    const openEdit = (id) => {
      const c = list.find((x) => x.id === id);
      if (!c) return;
      mode = "edit"; editingId = id;
      $("cuTitle").textContent = "编辑客户";
      $("cuOk").textContent = "确认保存";
      $("c_no").value = c.no;
      $("c_name").value = c.name || "";
      $("c_contact").value = c.contact || "";
      $("c_phone").value = c.phone || "";
      $("c_region").value = c.region || "";
      $("c_ind").value = c.industryId || "";
      $("c_type").value = c.companyTypeId || "";
      $("c_src").value = c.sourceId || "";
      $("c_owner").value = c.ownerId || "";
      $("c_st").value = c.statusId || "potential";
      $("c_addr").value = c.address || "";
      $("c_note").value = c.remark || "";
      $("cuMask").classList.add("show");
    };

    const collect = () => ({
      no: $("c_no").value,
      name: $("c_name").value.trim(),
      contact: $("c_contact").value.trim(),
      phone: $("c_phone").value.trim(),
      region: $("c_region").value.trim(),
      industryId: $("c_ind").value,
      companyTypeId: $("c_type").value,
      sourceId: $("c_src").value,
      ownerId: $("c_owner").value,
      statusId: $("c_st").value || "potential",
      address: $("c_addr").value.trim(),
      remark: $("c_note").value.trim()
    });

    $("btnCreate").addEventListener("click", openCreate);
    $("cuOk").addEventListener("click", () => {
      const data = collect();
      if (!data.name || !data.contact || !data.phone) { toast("请填写客户名称、联系人和手机号"); return; }
      if (mode === "edit") {
        const i = list.findIndex((x) => x.id === editingId);
        const prev = { ...list[i] };
        list[i] = { ...list[i], ...data };
        CRM.saveCustomers(list);
        CRM.syncCustomerLinks(list[i], prev);
        toast("客户已更新，并已同步线索 / 商机 / 合同");
      } else {
        const row = { id: "cu-new-" + Date.now(), createdAt: new Date().toISOString().slice(0, 10), leadId: "", oppId: "", ...data };
        list.unshift(row);
        CRM.saveCustomers(list);
        if (row.statusId === "deal" && row.ownerId) CRM.bumpMetric(row.ownerId, "customerActual", 1);
        toast("客户已新增，合同「老客户」可匹配该公司");
      }
      $("cuMask").classList.remove("show");
      render();
    });

    const applyQuery = () => {
      query = { name: $("fName").value.trim(), contact: $("fContact").value.trim(), phone: $("fPhone").value.trim(), no: $("fNo").value.trim(), source: $("fSource").value, status: $("fStatus").value };
      page = 1; render();
    };
    $("btnQuery").addEventListener("click", applyQuery);
    $("btnReset").addEventListener("click", () => {
      $("fName").value = $("fContact").value = $("fPhone").value = $("fNo").value = $("fSource").value = $("fStatus").value = "";
      applyQuery();
    });
    $("pageSize").addEventListener("change", () => { page = 1; render(); });
    $("pages").addEventListener("click", (e) => { const b = e.target.closest("[data-p]"); if (b) { page = Number(b.dataset.p); render(); } });
    $("btnJump").addEventListener("click", () => { page = Math.max(1, Number($("jump").value) || 1); render(); });
    $("tbody").addEventListener("click", (e) => { const b = e.target.closest("[data-id]"); if (b) openEdit(b.dataset.id); });

    if (new URLSearchParams(location.search).get("add") === "1") openCreate();
    render();
  </script>
</body>
</html>
