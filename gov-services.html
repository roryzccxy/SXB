<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>政务服务 - CRM</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <script src="js/auth.js"></script>
  <style>
    .toolbar { padding: 16px; margin-bottom: 16px; }
    .filter-grid { display: grid; grid-template-columns: auto 1fr auto 1fr auto 1fr auto 1fr auto 1fr; gap: 10px 8px; align-items: center; }
    .filter-grid label { font-size: var(--fs-sm); color: var(--text); text-align: right; white-space: nowrap; }
    .filter-grid input, .filter-grid select { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .dates { display: flex; align-items: center; gap: 6px; }
    .dates span { color: var(--text-secondary); font-size: 12px; }
    .filter-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; grid-column: 9 / 11; }
    .btn-md { height: 32px; padding: 0 14px; font-size: var(--fs-sm); }
    .list-card { overflow: auto; }
    .tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--border); }
    .tab { border: 0; background: none; padding: 8px 12px 10px; color: var(--text-secondary); cursor: pointer; font-size: var(--fs-sm); position: relative; }
    .tab.active { color: var(--primary); font-weight: 600; }
    .tab.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--primary); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px 8px; text-align: left; border-top: 1px solid #f0f0f0; white-space: nowrap; }
    th { background: #fafafa; color: var(--text-secondary); font-weight: 600; }
    .link { border: 0; background: none; color: var(--primary); cursor: pointer; font-size: 12px; padding: 0 8px 0 0; }
    .pager-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: var(--fs-xs); color: var(--text-secondary); }
    .pager-right { display: flex; align-items: center; gap: 6px; }
    .pager-bar button { min-width: 24px; height: 24px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; }
    .pager-bar button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager-bar button:disabled { opacity: 0.45; cursor: default; }
    .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: center; justify-content: center; padding: 16px; }
    .mask.show { display: flex; }
    .modal { width: 720px; max-width: 100%; background: #fff; border-radius: var(--radius); max-height: calc(100vh - 24px); overflow: auto; position: relative; }
    .modal-head { height: 44px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; font-weight: 600; z-index: 1; }
    .modal-close { position: absolute; right: 12px; top: 0; height: 44px; border: 0; background: none; color: #fff; font-size: 22px; cursor: pointer; }
    .modal-body { padding: 18px 22px 8px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 22px 20px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .field label { display: block; font-size: var(--fs-xs); color: var(--text-secondary); margin-bottom: 6px; }
    .field input, .field select, .field textarea { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .field textarea { height: 72px; padding: 8px; resize: vertical; }
    .ro { background: #f5f5f5 !important; }
    .full { grid-column: 1 / -1; }
    .log { font-size: 12px; color: var(--text-secondary); padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
    @media (max-width: 1200px) { .filter-grid { grid-template-columns: auto 1fr auto 1fr; } .filter-actions { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div class="toast-wrap" id="toasts"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">CRM</div>
      <nav class="nav">
        <a class="nav-item" href="workbench.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>

        <div class="nav-group open">

          <div class="nav-sub">
            <a class="nav-item" href="marketing-goals.html">营销目标</a>
            <a class="nav-item" href="leads.html">线索管理</a>
            <a class="nav-item" href="opportunities.html">商机管理</a>
            <a class="nav-item" href="contracts.html">合同管理</a>
            <a class="nav-item" href="customers.html">客户管理</a>
            <a class="nav-item" href="sales-performance.html">销售业绩</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M4 19c.5-3 2.8-5 5-5s4.5 2 5 5"/><path d="M16 8h5M18.5 5.5v5"/></svg>客户中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item active" href="gov-services.html">政务服务</a>

            <a class="nav-item" href="addresses.html">地址管理</a>
            <a class="nav-item" href="customer-items.html">客户物品</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>运营中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="reimbursements.html">财务报销</a>
            <a class="nav-item" href="reports.html">经营报表</a>
            <a class="nav-item" href="personnel.html">人事管理</a>
            <a class="nav-item" href="salary.html">薪资管理</a>
            <a class="nav-item" href="employees.html">员工管理</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>系统管理</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="roles.html">角色权限</a>
            <button class="nav-item" data-page="pending" type="button">字典管理</button>
            <button class="nav-item" data-page="pending" type="button">菜单管理</button>
          </div>
        </div>
      </nav>
    </aside>
    <div class="main">
      <header class="header">
        <div class="dropdown" id="mailDrop">
          <button class="icon-btn" type="button" data-toggle="mailDrop" aria-label="消息"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></button>
          <div class="dropdown-panel"><div class="empty">暂无新消息</div></div>
        </div>
        <button class="icon-btn soon" type="button" aria-label="帮助"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 17v-1M12 8a2.2 2.2 0 0 1 1 4c-.6.5-1 1-1 2"/></svg></button>
        <div class="dropdown" id="userDrop">
          <button class="user-chip" type="button" data-toggle="userDrop"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 19c1-4 3.5-6 7-6s6 2 7 6"/></svg>用户</button>
          <div class="dropdown-panel"><button type="button" class="soon">个人中心</button><button type="button" data-logout>退出登录</button></div>
        </div>
      </header>
      <main class="content">
        <section class="card toolbar">
          <div class="filter-grid">
            <label>企业名称</label><input id="fName" placeholder="请输入" list="custList" />
            <label>业务类型</label><select id="fType"></select>
            <label>所属区域</label><select id="fRegion"></select>
            <label>销售顾问</label><select id="fOwner"></select>
            <label>所属部门</label><select id="fDept"></select>
            <label>线上申报员</label><select id="fOnline"></select>
            <label>线下提报员</label><select id="fOffline"></select>
            <label>创建时间</label>
            <div class="dates">
              <input id="fFrom" type="date" />
              <span>至</span>
              <input id="fTo" type="date" />
            </div>
            <div class="filter-actions">
              <button class="btn btn-primary btn-md" id="btnQuery" type="button">确定</button>
              <button class="btn btn-ghost btn-md" id="btnReset" type="button">重置</button>
              <button class="btn btn-primary btn-md" id="btnAdd" type="button">新增政务工单</button>
            </div>
          </div>
        </section>
        <section class="card list-card">
          <div class="tabs" id="tabs">
            <button class="tab" data-tab="" type="button">全部</button>
            <button class="tab active" data-tab="doing" type="button">办理中</button>
            <button class="tab" data-tab="done" type="button">已完成</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>企业名称</th><th>业务类型</th><th>所属区域</th><th>销售顾问</th><th>所属部门</th>
                <th>线上申报员</th><th>线下提报员</th><th>客户资料</th><th>接收资料时间</th>
                <th>已办理天数</th><th>派单时间</th><th>完成日期</th><th>查看详情</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="pager-bar">
            <span id="pageInfo">共 0 条</span>
            <div class="pager-right" id="pages"></div>

        </section>

  <datalist id="custList"></datalist>

  <div class="mask" id="addMask">
    <div class="modal">
      <div class="modal-head">新增政务工单<button class="modal-close" data-close="addMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two">
          <div class="field"><label>工单编号</label><input id="a_no" class="ro" readonly /></div>
          <div class="field"><label>企业名称</label><input id="a_name" list="custList" placeholder="匹配客户管理企业" /></div>
          <div class="field"><label>业务类型</label><select id="a_type"></select></div>
          <div class="field"><label>所属区域</label><select id="a_region"></select></div>
          <div class="field"><label>销售顾问</label><select id="a_owner"></select></div>
          <div class="field"><label>所属部门</label><select id="a_dept"></select></div>
          <div class="field"><label>客户资料</label><select id="a_hand"></select></div>
          <div class="field full"><label>备注</label><textarea id="a_remark" placeholder="选填"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="addMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="btnAddOk" type="button">确认新增</button>
      </div>
    </div>
  </div>

  <div class="mask" id="viewMask">
    <div class="modal">
      <div class="modal-head">工单详情<button class="modal-close" data-close="viewMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two" id="viewGrid"></div>
        <div class="field full" style="margin-top:12px"><label>办理记录</label><div id="viewLogs"></div></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="viewMask" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div class="mask" id="actMask">
    <div class="modal">
      <div class="modal-head"><span id="actTitle">派单</span><button class="modal-close" data-close="actMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two">
          <div class="field"><label>企业名称</label><input id="t_name" class="ro" readonly /></div>
          <div class="field"><label>业务类型</label><input id="t_type" class="ro" readonly /></div>
          <div class="field" id="rowOnline"><label>线上申报员</label><select id="t_online"></select></div>

          <div class="field full" id="rowNote"><label id="tNoteLab">说明</label><textarea id="t_note" placeholder="请输入"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="actMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="btnActOk" type="button">确认</button>
      </div>
    </div>
  </div>

  <script src="js/crm-store.js"></script>
  <script>
    const toast = (m) => { const el = document.createElement("div"); el.className = "toast"; el.textContent = m; document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 1800); };
    document.querySelectorAll(".nav-group-btn").forEach((b) => b.addEventListener("click", () => b.parentElement.classList.toggle("open")));
    document.querySelectorAll("[data-page=pending],.soon").forEach((el) => el.addEventListener("click", () => toast("功能即将开放")));
    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); document.querySelectorAll(".dropdown").forEach((d) => d.classList.toggle("open", d.id === btn.dataset.toggle && !d.classList.contains("open"))); });
    });
    document.addEventListener("click", () => document.querySelectorAll(".dropdown").forEach((d) => d.classList.remove("open")));
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => document.getElementById(b.dataset.close).classList.remove("show")));

    const $ = (id) => document.getElementById(id);
    const fillSel = (el, list, all) => { el.innerHTML = `<option value="">${all}</option>` + list.map((x) => `<option value="${x.id}">${x.name}</option>`).join(""); };
    const staff = CRM.loadStaff().filter((s) => s.statusId !== "left");
    const staffOpt = staff.map((s) => ({ id: s.id, name: s.name }));
    fillSel($("fType"), CRM.dicts.govTypes, "请选择");
    fillSel($("fRegion"), CRM.dicts.regions, "请选择");
    fillSel($("fOwner"), staffOpt, "请选择");
    fillSel($("fDept"), CRM.dicts.depts, "请选择");
    fillSel($("fOnline"), staffOpt, "请选择");
    fillSel($("fOffline"), staffOpt, "请选择");
    fillSel($("a_type"), CRM.dicts.govTypes, "请选择");
    fillSel($("a_region"), CRM.dicts.regions, "请选择");
    fillSel($("a_owner"), staffOpt, "请选择");
    fillSel($("a_dept"), CRM.dicts.depts, "请选择");
    fillSel($("a_hand"), CRM.dicts.govHands, "请选择");
    fillSel($("t_online"), staffOpt, "请选择");
    fillSel($("t_offline"), staffOpt, "请选择");
    $("custList").innerHTML = CRM.loadCustomers().slice(0, 80).map((c) => `<option value="${c.name}"></option>`).join("");

    const who = (id) => {
      if (!id) return "--";
      const p = CRM.person(id) || staff.find((s) => s.id === id);
      return (p && p.name) || "--";
    };
    const now = () => CRM.HR_ASOF + " 16:03";

    let list = CRM.loadGov();
    let page = 1;
    const pageSize = 10;
    let tab = "doing";
    let query = {};
    let actId = "";
    let actKind = "";

    const persist = (row) => {
      const i = list.findIndex((x) => x.id === row.id);
      if (i >= 0) list[i] = row; else list.unshift(row);
      CRM.saveGov(list);
      list = CRM.loadGov();
      render();
    };

    const filtered = () => list.filter((r) => {
      if (tab && r.statusId !== tab) return false;
      if (query.name && !(r.customerName || "").includes(query.name)) return false;
      if (query.typeId && r.typeId !== query.typeId) return false;
      if (query.regionId && r.regionId !== query.regionId) return false;
      if (query.ownerId && r.ownerId !== query.ownerId) return false;
      if (query.deptId && r.deptId !== query.deptId) return false;
      if (query.onlineId && r.onlineId !== query.onlineId) return false;
      if (query.offlineId && r.offlineId !== query.offlineId) return false;
      const day = String(r.createdAt || "").slice(0, 10);
      if (query.from && day < query.from) return false;
      if (query.to && day > query.to) return false;
      return true;
    });

    const pagerBtns = (pages) => {
      const nums = [];
      if (pages <= 8) for (let i = 1; i <= pages; i++) nums.push(i);
      else if (page <= 4) nums.push(1, 2, 3, 4, 5, 6, "…", pages);
      else if (page >= pages - 3) nums.push(1, "…", pages - 5, pages - 4, pages - 3, pages - 2, pages - 1, pages);
      else nums.push(1, "…", page - 1, page, page + 1, "…", pages);
      return `<button type="button" data-p="${page - 1}" ${page <= 1 ? "disabled" : ""}>‹</button>` +
        nums.map((n) => n === "…" ? `<span>…</span>` : `<button class="${n === page ? "on" : ""}" data-p="${n}" type="button">${n}</button>`).join("") +
        `<button type="button" data-p="${page + 1}" ${page >= pages ? "disabled" : ""}>›</button>`;
    };

    const ops = (r) => {
      if (r.statusId === "done") return "";
      if (!r.dispatchAt) return `<button class="link" data-act="dispatch" data-id="${r.id}" type="button">派单</button>`;
      return `<button class="link" data-act="progress" data-id="${r.id}" type="button">添加进度</button><button class="link" data-act="move" data-id="${r.id}" type="button">移交</button>`;
    };

    const render = () => {
      list = CRM.loadGov();
      const rows = filtered();
      const pages = Math.max(1, Math.ceil(rows.length / pageSize));
      if (page > pages) page = pages;
      $("pageInfo").textContent = `共 ${rows.length} 条`;
      $("tbody").innerHTML = rows.slice((page - 1) * pageSize, page * pageSize).map((r) => `<tr>
        <td>${r.customerName}</td>
        <td>${CRM.dictName("govTypes", r.typeId)}</td>
        <td>${CRM.dictName("regions", r.regionId)}</td>
        <td>${who(r.ownerId)}</td>
        <td>${CRM.dictName("depts", r.deptId)}</td>
        <td>${who(r.onlineId)}</td>
        <td>${who(r.offlineId)}</td>
        <td>${CRM.dictName("govHands", r.handId)}</td>
        <td>${r.recvAt || "--"}</td>
        <td>${r.days ? r.days + "天" : "--"}</td>
        <td>${r.dispatchAt || "--"}</td>
        <td>${r.doneAt || "--"}</td>
        <td><button class="link" data-act="view" data-id="${r.id}" type="button">查看详情</button></td>
        <td>${ops(r)}</td>
      </tr>`).join("") || `<tr><td colspan="14">暂无工单</td></tr>`;
      $("pages").innerHTML = pagerBtns(pages);
    };

    const openAdd = () => {
      $("a_no").value = CRM.nextGovNo(list);
      $("a_name").value = $("a_type").value = $("a_region").value = $("a_owner").value = $("a_dept").value = $("a_hand").value = "";
      $("a_remark").value = "";
      $("a_hand").value = "none";
      $("addMask").classList.add("show");
    };

    $("a_owner").addEventListener("change", () => {
      const s = staff.find((x) => x.id === $("a_owner").value);
      if (s) $("a_dept").value = s.deptId || "";
    });
    $("a_name").addEventListener("change", () => {
      const c = CRM.loadCustomers().find((x) => x.name === $("a_name").value.trim());
      if (!c) return;
      if (c.ownerId) $("a_owner").value = c.ownerId;
      const p = CRM.person(c.ownerId) || staff.find((s) => s.id === c.ownerId);
      if (p) $("a_dept").value = p.deptId || "";
    });

    const openView = (id) => {
      const r = list.find((x) => x.id === id);
      if (!r) return;
      const cell = (k, v) => `<div class="field"><label>${k}</label><input class="ro" readonly value="${v || "--"}" /></div>`;
      $("viewGrid").innerHTML = [
        cell("工单编号", r.no), cell("企业名称", r.customerName),
        cell("业务类型", CRM.dictName("govTypes", r.typeId)), cell("所属区域", CRM.dictName("regions", r.regionId)),
        cell("销售顾问", who(r.ownerId)), cell("所属部门", CRM.dictName("depts", r.deptId)),
        cell("线上申报员", who(r.onlineId)), cell("线下提报员", who(r.offlineId)),
        cell("客户资料", CRM.dictName("govHands", r.handId)), cell("接收资料时间", r.recvAt),
        cell("已办理天数", r.days ? r.days + "天" : ""), cell("派单时间", r.dispatchAt),
        cell("完成日期", r.doneAt), cell("状态", CRM.dictName("govTicketStatuses", r.statusId))
      ].join("") + `<div class="field full"><label>备注</label><input class="ro" readonly value="${r.remark || "--"}" /></div>
        <div class="field full"><a href="customers.html?name=${encodeURIComponent(r.customerName)}" style="color:var(--primary);font-size:12px;text-decoration:none">查看客户档案</a>
        <a href="personnel.html?person=${encodeURIComponent(r.ownerId || "")}" style="color:var(--primary);font-size:12px;text-decoration:none;margin-left:16px">查看销售顾问</a></div>`;
      $("viewLogs").innerHTML = (r.logs || []).map((l) => `<div class="log">${l.at} · ${l.title} · ${l.text || ""}</div>`).join("") || `<div class="log">暂无记录</div>`;
      $("viewMask").classList.add("show");
    };

    const openAct = (kind, id) => {
      const r = list.find((x) => x.id === id);
      if (!r) return;
      actKind = kind; actId = id;
      $("t_name").value = r.customerName;
      $("t_type").value = CRM.dictName("govTypes", r.typeId);
      $("t_online").value = r.onlineId || "";
      $("t_offline").value = r.offlineId || "";
      $("t_note").value = "";
      $("rowOnline").style.display = kind === "progress" ? "none" : "";
      $("rowOffline").style.display = kind === "progress" ? "none" : "";
      $("actTitle").textContent = kind === "dispatch" ? "派单" : kind === "move" ? "移交" : "添加进度";
      $("tNoteLab").textContent = kind === "progress" ? "进度说明（填写「完成」将办结工单）" : "说明";
      $("actMask").classList.add("show");
    };

    $("btnAdd").addEventListener("click", openAdd);
    $("btnAddOk").addEventListener("click", () => {
      const name = $("a_name").value.trim();
      if (!name) { toast("请填写企业名称"); return; }
      if (!$("a_type").value) { toast("请选择业务类型"); return; }
      const cu = CRM.loadCustomers().find((c) => c.name === name);
      const ownerId = $("a_owner").value || (cu && cu.ownerId) || "";
      const p = staff.find((s) => s.id === ownerId);
      persist({
        id: "gov-" + Date.now(),
        no: $("a_no").value || CRM.nextGovNo(list),
        customerName: name,
        customerId: (cu && cu.id) || "",
        typeId: $("a_type").value,
        regionId: $("a_region").value || "zjh",
        ownerId,
        deptId: $("a_dept").value || (p && p.deptId) || "",
        onlineId: "",
        offlineId: "",
        handId: $("a_hand").value || "none",
        recvAt: "",
        days: 0,
        dispatchAt: "",
        doneAt: "",
        statusId: "doing",
        createdAt: now().replace("16:03", "09:00"),
        remark: $("a_remark").value.trim(),
        logs: [{ at: now(), title: "创建工单", text: CRM.currentUser().name }]
      });
      $("addMask").classList.remove("show");
      toast("已新增工单");
    });
    $("btnActOk").addEventListener("click", () => {
      const r = list.find((x) => x.id === actId);
      if (!r) return;
      const note = $("t_note").value.trim();
      if (actKind === "dispatch") {
        if (!$("t_online").value && !$("t_offline").value) { toast("请指定申报员或提报员"); return; }
        r.onlineId = $("t_online").value;
        r.offlineId = $("t_offline").value;
        r.dispatchAt = now();
        r.days = 1;
        r.logs = r.logs || [];
        r.logs.unshift({ at: now(), title: "派单", text: note || ("线上 " + who(r.onlineId) + " / 线下 " + who(r.offlineId)) });
      } else if (actKind === "move") {
        r.onlineId = $("t_online").value;
        r.offlineId = $("t_offline").value;
        r.logs = r.logs || [];
        r.logs.unshift({ at: now(), title: "移交", text: note || ("移交至 " + who(r.onlineId)) });
      } else {
        r.days = Number(r.days || 0) + 1;
        if (note.indexOf("完成") >= 0) {
          r.statusId = "done";
          r.doneAt = CRM.HR_ASOF;
        }
        r.logs = r.logs || [];
        r.logs.unshift({ at: now(), title: "添加进度", text: note || ("已办理 " + r.days + " 天") });
      }
      persist(r);
      $("actMask").classList.remove("show");
      toast("已保存");
    });

    $("btnQuery").addEventListener("click", () => {
      query = {
        name: $("fName").value.trim(), typeId: $("fType").value, regionId: $("fRegion").value,
        ownerId: $("fOwner").value, deptId: $("fDept").value, onlineId: $("fOnline").value,
        offlineId: $("fOffline").value, from: $("fFrom").value, to: $("fTo").value
      };
      page = 1; render();
    });
    $("btnReset").addEventListener("click", () => {
      $("fName").value = $("fType").value = $("fRegion").value = $("fOwner").value = $("fDept").value = $("fOnline").value = $("fOffline").value = $("fFrom").value = $("fTo").value = "";
      query = {}; page = 1; render();
    });
    $("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("[data-tab]");
      if (!b) return;
      tab = b.dataset.tab;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === b));
      page = 1; render();
    });
    $("pages").addEventListener("click", (e) => {
      const b = e.target.closest("[data-p]");
      if (!b || b.disabled) return;
      const n = Number(b.dataset.p);
      if (n >= 1) { page = n; render(); }
    });
    $("tbody").addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      if (b.dataset.act === "view") openView(b.dataset.id);
      else openAct(b.dataset.act, b.dataset.id);
    });

    render();
  </script>
</body>
</html>
