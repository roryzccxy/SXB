<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商机管理 - CRM</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <script src="js/auth.js"></script>
  <style>
    .toolbar { padding: 16px; }
    .filter-grid { display: grid; grid-template-columns: repeat(5, auto 1fr); gap: 10px 8px; align-items: center; }
    .filter-grid label { font-size: var(--fs-sm); color: var(--text); text-align: right; }
    .field input, .field select, .filter-grid input, .filter-grid select {
      height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff;
    }
    .field label { display: block; font-size: var(--fs-xs); color: var(--text-secondary); margin-bottom: 6px; }
    .field textarea { width: 100%; min-height: 72px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 8px; }
    .actions { margin-top: 12px; }
    .btn-md { height: 32px; padding: 0 14px; font-size: var(--fs-sm); }
    .flow-note { margin-top: 10px; font-size: 11px; color: var(--text-secondary); line-height: 1.6; }
    .list-card { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px; text-align: left; border-top: 1px solid #f0f0f0; white-space: nowrap; }
    th { background: #fafafa; color: var(--text-secondary); font-weight: 600; }
    .link { border: 0; background: none; color: var(--primary); cursor: pointer; font-size: 12px; padding: 0 8px 0 0; }
    .link.ok { color: #389e0d; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .b-intent { background: #e6f4ff; color: var(--primary); }
    .b-win { background: #f6ffed; color: #389e0d; }
    .b-lost { background: #f5f5f5; color: #8c8c8c; }
    .pager-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 16px; font-size: var(--fs-xs); color: var(--text-secondary); }
    .pager-bar button { min-width: 24px; height: 24px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; }
    .pager-bar button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager-bar input { width: 40px; height: 24px; }
    .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: center; justify-content: center; padding: 24px; }
    .mask.show { display: flex; }
    .modal { width: 560px; max-width: 100%; background: #fff; border-radius: var(--radius); max-height: calc(100vh - 40px); overflow: auto; }
    .modal-head { height: 44px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; position: relative; font-weight: 600; }
    .modal-close { position: absolute; right: 12px; top: 0; bottom: 0; border: 0; background: none; color: #fff; font-size: 18px; cursor: pointer; }
    .modal-body { padding: 18px 22px 8px; }
    .modal-foot { display: flex; justify-content: center; gap: 12px; padding: 12px 22px 20px; }
    .unit-wrap { position: relative; }
    .unit-wrap input { padding-right: 28px; }
    .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-secondary); }
    @media (max-width: 1100px) { .filter-grid { grid-template-columns: auto 1fr auto 1fr; } }
  </style>
</head>
<body>
  <div class="toast-wrap" id="toasts"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">CRM</div>
      <nav class="nav">
        <a class="nav-item" href="workbench.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          工作台
        </a>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16l3-4 3 2 4-6"/></svg>销售中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="marketing-goals.html">营销目标</a>
            <a class="nav-item" href="leads.html">线索管理</a>
            <a class="nav-item active" href="opportunities.html">商机管理</a>
            <a class="nav-item" href="contracts.html">合同管理</a>
            <a class="nav-item" href="customers.html">客户管理</a>
            <button class="nav-item" data-page="pending" type="button">销售业绩</button>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M4 19c.5-3 2.8-5 5-5s4.5 2 5 5"/><path d="M16 8h5M18.5 5.5v5"/></svg>客户中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <button class="nav-item" data-page="pending" type="button">政务服务</button>
            <button class="nav-item" data-page="pending" type="button">代账服务</button>
            <button class="nav-item" data-page="pending" type="button">地址管理</button>
            <button class="nav-item" data-page="pending" type="button">客户物品</button>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>运营中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <button class="nav-item" data-page="pending" type="button">财务报销</button>
            <button class="nav-item" data-page="pending" type="button">经营报表</button>
            <button class="nav-item" data-page="pending" type="button">人事管理</button>
            <button class="nav-item" data-page="pending" type="button">薪资管理</button>
            <button class="nav-item" data-page="pending" type="button">员工管理</button>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>系统管理</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <button class="nav-item" data-page="pending" type="button">角色权限</button>
            <button class="nav-item" data-page="pending" type="button">字典管理</button>
            <button class="nav-item" data-page="pending" type="button">菜单管理</button>
          </div>
        </div>
      </nav>
    </aside>
    <div class="main">
      <header class="header">
        <div class="dropdown" id="mailDrop">
          <button class="icon-btn" type="button" data-toggle="mailDrop" aria-label="消息"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></button>
          <div class="dropdown-panel"><div class="empty">暂无新消息</div></div>
        </div>
        <div class="dropdown" id="userDrop">
          <button class="user-chip" type="button" data-toggle="userDrop"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 19c1-4 3.5-6 7-6s6 2 7 6"/></svg>用户</button>
          <div class="dropdown-panel"><button type="button" class="soon">个人中心</button><button type="button" data-logout>退出登录</button></div>
        </div>
      </header>
      <main class="content">
        <section class="card toolbar">
          <div class="filter-grid">
            <label>产品</label><select id="fProduct"></select>
            <label>客户名称</label><input id="fName" placeholder="输入文本" />
            <label>联系人</label><input id="fContact" placeholder="请输入" />
            <label>联系电话</label><input id="fPhone" placeholder="请输入" />
            <label>商机等级</label><select id="fLevel"></select>
            <label>商机阶段</label><select id="fStage"></select>
          </div>
          <div class="actions">
            <button class="btn btn-ghost btn-md" id="btnReset" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;vertical-align:-2px"><path d="M3 12a9 9 0 0 1 15.5-6.4M21 12a9 9 0 0 1-15.5 6.4"/><path d="M3 4v8h8M21 20v-8h-8"/></svg>
              重置搜索条件
            </button>
          </div>
        </section>
        <section class="card list-card">
          <table>
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="pager-bar">
            <span id="pageInfo"></span>
            <div id="pages"></div>
            <select id="pageSize"><option>10</option><option>20</option></select> 条/页
            跳至 <input id="jump" /> 页 <button type="button" id="btnJump">跳转</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="mask" id="editMask">
    <div class="modal">
      <div class="modal-head" id="editTitle">编辑商机<button class="modal-close" data-close="editMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="field" style="margin-bottom:10px"><label>客户名称</label><input id="e_name" /></div>
        <div class="field" style="margin-bottom:10px"><label>联系人</label><input id="e_contact" /></div>
        <div class="field" style="margin-bottom:10px"><label>联系电话</label><input id="e_phone" /></div>
        <div class="field" style="margin-bottom:10px"><label>意向产品</label><select id="e_product"></select></div>
        <div class="field" style="margin-bottom:10px"><label>商机等级</label><select id="e_level"></select></div>
        <div class="field" style="margin-bottom:10px"><label>商机阶段</label><select id="e_stage"></select></div>
        <div class="field" style="margin-bottom:10px"><label id="e_noteLab">说明</label><textarea id="e_note"></textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary btn-md" id="editOk" type="button">确认</button>
        <button class="btn btn-ghost btn-md" data-close="editMask" type="button">取消</button>
      </div>
    </div>
  </div>

  <div class="mask" id="ctMask">
    <div class="modal">
      <div class="modal-head">创建合同<button class="modal-close" data-close="ctMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="field" style="margin-bottom:10px"><label>合同编号</label><input id="c_no" disabled /></div>
        <div class="field" style="margin-bottom:10px"><label>客户名称</label><input id="c_name" disabled /></div>
        <div class="field" style="margin-bottom:10px"><label>合同金额</label><div class="unit-wrap"><input id="c_amt" type="number" min="0" step="0.1" /><span class="unit">万</span></div></div>
        <div class="field"><label>成交时间</label><input id="c_time" type="datetime-local" /></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary btn-md" id="ctOk" type="button">确认</button>
        <button class="btn btn-ghost btn-md" data-close="ctMask" type="button">取消</button>
      </div>
    </div>
  </div>

  <div class="mask" id="fuMask">
    <div class="modal">
      <div class="modal-head">添加跟进<button class="modal-close" data-close="fuMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="field" style="margin-bottom:10px"><label>跟进时间</label><input id="fu_time" type="datetime-local" /></div>
        <div class="field" style="margin-bottom:10px"><label>转换商机阶段</label><select id="fu_stage"></select></div>
        <div class="field"><label id="fu_textLab">跟进内容</label><textarea id="fu_text" placeholder="请输入跟进内容"></textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary btn-md" id="fuOk" type="button">确认</button>
        <button class="btn btn-ghost btn-md" data-close="fuMask" type="button">取消</button>
      </div>
    </div>
  </div>

  <script src="js/crm-store.js"></script>
  <script>
    const toast = (m) => { const el = document.createElement("div"); el.className = "toast"; el.textContent = m; document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 1800); };
    document.querySelectorAll(".nav-group-btn").forEach((b) => b.addEventListener("click", () => b.parentElement.classList.toggle("open")));
    document.querySelectorAll("[data-page=pending],.soon").forEach((el) => el.addEventListener("click", () => toast("功能即将开放")));
    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); document.querySelectorAll(".dropdown").forEach((d) => d.classList.toggle("open", d.id === btn.dataset.toggle && !d.classList.contains("open"))); });
    });
    document.addEventListener("click", () => document.querySelectorAll(".dropdown").forEach((d) => d.classList.remove("open")));
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => document.getElementById(b.dataset.close).classList.remove("show")));

    const fProduct = document.getElementById("fProduct");
    const fName = document.getElementById("fName");
    const fContact = document.getElementById("fContact");
    const fPhone = document.getElementById("fPhone");
    const fLevel = document.getElementById("fLevel");
    const fStage = document.getElementById("fStage");
    const thead = document.getElementById("thead");
    const tbody = document.getElementById("tbody");
    const pageSize = document.getElementById("pageSize");
    const pagesBox = document.getElementById("pages");
    const pageInfo = document.getElementById("pageInfo");
    const eProduct = document.getElementById("e_product");
    const eLevel = document.getElementById("e_level");
    const eStage = document.getElementById("e_stage");
    const eName = document.getElementById("e_name");
    const eContact = document.getElementById("e_contact");
    const ePhone = document.getElementById("e_phone");
    const eNote = document.getElementById("e_note");
    const eNoteLab = document.getElementById("e_noteLab");
    const cTime = document.getElementById("c_time");
    const cNo = document.getElementById("c_no");
    const cName = document.getElementById("c_name");
    const cAmt = document.getElementById("c_amt");
    const fuTime = document.getElementById("fu_time");
    const fuText = document.getElementById("fu_text");
    const fuStage = document.getElementById("fu_stage");
    const fuTextLab = document.getElementById("fu_textLab");

    const fill = (el, list, all) => { el.innerHTML = `<option value="">${all}</option>` + list.map((x) => `<option value="${x.id}">${x.name}</option>`).join(""); };
    fill(fProduct, CRM.dicts.products, "请选择");
    fill(fLevel, CRM.dicts.oppLevels, "请选择");
    fill(fStage, CRM.dicts.oppStages, "请选择");
    fill(eProduct, CRM.dicts.products, "请选择");
    fill(eLevel, CRM.dicts.oppLevels, "请选择");
    fill(eStage, CRM.dicts.oppStages, "请选择");
    fill(fuStage, CRM.dicts.oppStages.filter((x) => x.id !== "win"), "请选择");

    const minDT = () => {
      const d = new Date();
      const y = Math.max(d.getFullYear(), 2026);
      const m = y === 2026 ? Math.max(d.getMonth() + 1, 8) : d.getMonth() + 1;
      const day = y === d.getFullYear() && m === d.getMonth() + 1 ? d.getDate() : 1;
      const p = (n) => String(n).padStart(2, "0");
      return `${y}-${p(m)}-${p(day)}T00:00`;
    };
    const nowText = () => {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:00`;
    };
    cTime.min = fuTime.min = minDT();

    let opps = CRM.loadOpps();
    let page = 1;
    let currentId = null;

    const syncLeadStage = (opp) => {
      const leads = CRM.loadLeads();
      const lead = leads.find((l) => l.id === opp.leadId);
      if (!lead) return;
      lead.oppStageId = opp.stageId;
      lead.lastFollowAt = opp.lastFollowAt || lead.lastFollowAt;
      CRM.saveLeads(leads);
    };

    const filtered = () => opps.filter((o) => {
      if (fProduct.value && o.productId !== fProduct.value) return false;
      if (fName.value && !(o.customerName || "").includes(fName.value.trim())) return false;
      if (fContact.value && !(o.contact || "").includes(fContact.value.trim())) return false;
      if (fPhone.value && !(o.phone || "").includes(fPhone.value.trim())) return false;
      if (fLevel.value && o.levelId !== fLevel.value) return false;
      if (fStage.value && o.stageId !== fStage.value) return false;
      return true;
    });

    const badge = (id) => `<span class="badge b-${id}">${CRM.dictName("oppStages", id)}</span>`;
    const prod = (id) => `<button class="link" data-act="prod" data-pid="${id}" type="button">${CRM.dictName("products", id)}</button>`;

    const headers = {
      all: ["#", "意向产品", "客户名称", "联系人", "联系电话", "商机阶段", "商机等级", "说明", "操作"],
      intent: ["#", "意向产品", "客户/公司名称", "联系电话", "最后一次跟进时间", "商机阶段", "商机等级", "说明", "操作"],
      win: ["#", "合同", "客户名称", "联系人", "联系电话", "合同类型", "合同金额", "成交时间", "商机阶段", "商机等级", "操作"],
      lost: ["#", "意向产品", "客户名称", "联系人", "联系电话", "流失时间", "商机阶段", "商机等级", "流失说明", "操作"]
    };

    const ops = (o) => {
      const st = fStage.value;
      if (st === "intent") return `<button class="link ok" data-act="contract" data-id="${o.id}" type="button">创建合同</button><button class="link ok" data-act="follow" data-id="${o.id}" type="button">添加跟进</button>`;
      if (st === "win") return `<button class="link" data-act="contract" data-id="${o.id}" type="button">新增合同</button>`;
      if (st === "lost") return `<button class="link" data-act="del" data-id="${o.id}" type="button">删除</button>`;
      return `<button class="link ok" data-act="edit" data-id="${o.id}" type="button">编辑</button><button class="link" data-act="del" data-id="${o.id}" type="button">删除</button>`;
    };

    const cells = (o, i) => {
      const st = fStage.value;
      const p = prod(o.productId);
      if (st === "intent") return [i, p, o.customerName, o.phone, o.lastFollowAt || "—", badge(o.stageId), o.levelId, o.note || "—", ops(o)];
      if (st === "win") {
        const cts = CRM.loadContracts();
        const ct = cts.find((c) => c.oppId === o.id || (o.contractNo && c.no === o.contractNo));
        const typeId = (ct && ct.typeId) || CRM.productToType(o.productId);
        return [i, o.contractNo || "—", o.customerName, o.contact, o.phone, CRM.dictName("contractTypes", typeId), (o.contractAmount || 0) + "万", o.closedAt || "—", badge(o.stageId), o.levelId, ops(o)];
      }
      if (st === "lost") return [i, p, o.customerName, o.contact, o.phone, o.lostAt || "—", badge(o.stageId), o.levelId, o.lostReason || o.note || "—", ops(o)];
      return [i, p, o.customerName, o.contact, o.phone, CRM.dictName("oppStages", o.stageId), o.levelId, o.note || o.lostReason || "—", ops(o)];
    };

    const render = () => {
      const rows = filtered();
      const size = Number(pageSize.value);
      const pages = Math.max(1, Math.ceil(rows.length / size));
      if (page > pages) page = pages;
      const key = fStage.value || "all";
      thead.innerHTML = "<tr>" + headers[key].map((h) => `<th>${h}</th>`).join("") + "</tr>";
      tbody.innerHTML = rows.slice((page - 1) * size, page * size).map((o, idx) =>
        "<tr>" + cells(o, (page - 1) * size + idx + 1).map((c) => `<td>${c}</td>`).join("") + "</tr>"
      ).join("") || `<tr><td colspan="12">暂无商机，请先在线索管理中转商机</td></tr>`;
      pageInfo.textContent = `共 ${rows.length} 条`;
      pagesBox.innerHTML = Array.from({ length: pages }, (_, i) => `<button class="${i + 1 === page ? "on" : ""}" data-p="${i + 1}" type="button">${i + 1}</button>`).join("");
    };

    [fProduct, fName, fContact, fPhone, fLevel, fStage, pageSize].forEach((el) => el.addEventListener(el.tagName === "INPUT" ? "input" : "change", () => { page = 1; render(); }));
    document.getElementById("btnReset").addEventListener("click", () => {
      fProduct.value = fName.value = fContact.value = fPhone.value = fLevel.value = fStage.value = "";
      page = 1; render();
    });
    pagesBox.addEventListener("click", (e) => { const b = e.target.closest("[data-p]"); if (b) { page = Number(b.dataset.p); render(); } });
    document.getElementById("btnJump").addEventListener("click", () => { page = Math.max(1, Number(jump.value) || 1); render(); });

    eStage.addEventListener("change", () => {
      eNoteLab.textContent = eStage.value === "lost" ? "流失说明" : "说明";
      eNote.placeholder = eStage.value === "lost" ? "请输入流失说明" : "";
    });

    const openEdit = (id) => {
      currentId = id;
      const o = opps.find((x) => x.id === id);
      e_name.value = o.customerName; e_contact.value = o.contact; e_phone.value = o.phone;
      e_product.value = o.productId; e_level.value = o.levelId; e_stage.value = o.stageId;
      e_note.value = o.stageId === "lost" ? (o.lostReason || o.note) : o.note;
      e_stage.dispatchEvent(new Event("change"));
      document.getElementById("editMask").classList.add("show");
    };
    document.getElementById("editOk").addEventListener("click", () => {
      const o = opps.find((x) => x.id === currentId);
      if (e_stage.value === "lost" && !e_note.value.trim()) { toast("流失商机请填写流失说明"); return; }
      if (e_stage.value === "win" && !o.contractNo) { toast("成交请先走「创建合同」，以写入合同金额（万）"); return; }
      o.customerName = e_name.value; o.contact = e_contact.value; o.phone = e_phone.value;
      o.productId = e_product.value; o.levelId = e_level.value;
      const prev = o.stageId;
      o.stageId = e_stage.value;
      if (o.stageId === "lost") { o.lostReason = e_note.value; o.lostAt = o.lostAt || nowText(); o.note = e_note.value; }
      else o.note = e_note.value;
      CRM.saveOpps(opps); syncLeadStage(o);
      document.getElementById("editMask").classList.remove("show");
      toast("商机已更新"); render();
    });

    const openContract = (id) => { location.href = "contracts.html?opp=" + encodeURIComponent(id); };

    const syncFuText = () => {
      const lost = fuStage.value === "lost";
      fuTextLab.textContent = lost ? "流失说明" : "跟进内容";
      fuText.placeholder = lost ? "请输入流失说明" : "请输入跟进内容";
    };
    fuStage.addEventListener("change", syncFuText);

    const openFollow = (id) => {
      currentId = id;
      const o = opps.find((x) => x.id === id);
      fu_time.value = minDT();
      fu_text.value = "";
      fuStage.value = o.stageId || "intent";
      syncFuText();
      document.getElementById("fuMask").classList.add("show");
    };
    document.getElementById("fuOk").addEventListener("click", () => {
      const o = opps.find((x) => x.id === currentId);
      const nextStage = fuStage.value || o.stageId;
      if (nextStage === "lost" && !fu_text.value.trim()) {
        toast("流失商机请填写流失说明");
        return;
      }
      o.lastFollowAt = (fu_time.value || minDT()).replace("T", " ") + ":00";
      if (fu_text.value) o.note = fu_text.value;
      o.stageId = nextStage;
      if (nextStage === "lost") {
        o.lostReason = fu_text.value;
        o.lostAt = o.lostAt || o.lastFollowAt;
      }
      CRM.saveOpps(opps); syncLeadStage(o);
      const leads = CRM.loadLeads();
      const lead = leads.find((l) => l.id === o.leadId);
      if (lead) {
        lead.followContent = fu_text.value || lead.followContent;
        lead.lastFollowAt = o.lastFollowAt;
        lead.oppStageId = nextStage;
        if (nextStage === "lost") {
          lead.lostAt = o.lostAt;
          lead.lostReason = fu_text.value;
        }
        const logText = nextStage === "lost" ? ("流失说明：" + (fu_text.value || "—")) : ("跟进内容：" + (fu_text.value || "—"));
        lead.logs.unshift({ at: o.lastFollowAt, type: "follow", status: nextStage === "lost" ? "opportunity" : "following", user: "用户", text: logText });
        CRM.saveLeads(leads);
      }
      document.getElementById("fuMask").classList.remove("show");
      toast(nextStage === "lost" ? "已转为流失商机" : "跟进已回写线索最后跟进时间");
      render();
    });

    tbody.addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      if (b.dataset.act === "prod") { fProduct.value = b.dataset.pid; page = 1; render(); return; }
      if (b.dataset.act === "edit") openEdit(b.dataset.id);
      if (b.dataset.act === "contract") openContract(b.dataset.id);
      if (b.dataset.act === "follow") openFollow(b.dataset.id);
      if (b.dataset.act === "del") {
        const o = opps.find((x) => x.id === b.dataset.id);
        opps = opps.filter((x) => x.id !== b.dataset.id);
        CRM.saveOpps(opps);
        const leads = CRM.loadLeads();
        const lead = leads.find((l) => l.id === o.leadId);
        if (lead && o.stageId !== "win") {
          lead.followResult = "following";
          lead.oppStageId = "";
          CRM.saveLeads(leads);
          CRM.bumpMetric(o.ownerId, "oppActual", -1);
        }
        toast("已删除商机"); render();
      }
    });

    render();
  </script>
</body>
</html>
