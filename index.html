<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台 - CRM</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <style>
    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      color: rgba(255, 255, 255, 0.75);
      display: flex;
      flex-direction: column;
    }

    .logo {
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: var(--fs-logo);
      font-weight: 700;
      color: var(--logo);
      letter-spacing: 0.5px;
      user-select: none;
    }

    .nav {
      flex: 1;
      overflow: auto;
      padding: 8px 10px 24px;
    }

    .nav-item,
    .nav-group-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      padding: 0 12px;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: var(--fs-md);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
    }

    .nav-item:hover,
    .nav-group-btn:hover {
      background: var(--sidebar-hover);
      color: #fff;
    }

    a.nav-item {
      text-decoration: none;
      color: inherit;
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .nav-group-btn {
      justify-content: space-between;
    }

    .nav-group-btn .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chevron {
      width: 12px;
      height: 12px;
      transition: transform 0.2s;
      opacity: 0.7;
    }

    .nav-group.open .chevron {
      transform: rotate(180deg);
    }

    .nav-sub {
      display: none;
      padding: 2px 0 6px;
    }

    .nav-group.open .nav-sub {
      display: block;
    }

    .nav-sub .nav-item {
      height: 36px;
      padding-left: 38px;
      font-size: var(--fs-sm);
      color: rgba(255, 255, 255, 0.65);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: var(--header-height);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 20px;
      box-shadow: 0 1px 4px rgba(0, 21, 41, 0.06);
      position: relative;
      z-index: 5;
      gap: 4px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      color: #595959;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-btn:hover {
      background: #f5f5f5;
      color: var(--primary);
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 8px 0 4px;
      border: 0;
      background: transparent;
      border-radius: 18px;
      cursor: pointer;
      color: var(--text);
      font-size: var(--fs-md);
    }

    .user-chip:hover {
      background: #f5f5f5;
    }

    .content {
      flex: 1;
      overflow: auto;
      padding: var(--page-pad);
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .hero {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      background:
        radial-gradient(circle at 88% 20%, rgba(24, 144, 255, 0.16), transparent 28%),
        linear-gradient(90deg, #f3f8ff 0%, #eef6ff 48%, #f7fbff 100%);
    }

    .hero-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
    }

    .todo-badge {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 12px;
      border-radius: 13px;
      background: var(--primary);
      color: #fff;
      font-size: var(--fs-xs);
    }

    .hero-date {
      margin-left: auto;
      background: var(--primary);
      color: #fff;
      font-size: var(--fs-xs);
      padding: 4px 10px;
      border-radius: 4px;
      align-self: flex-start;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 0;
      min-height: 44px;
    }

    .section-title {
      font-size: var(--fs-md);
      font-weight: 600;
    }

    .more {
      border: 0;
      background: none;
      color: var(--primary);
      cursor: pointer;
      font-size: var(--fs-sm);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px 16px 16px;
    }

    .quick-card {
      height: 72px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      cursor: pointer;
      color: var(--text);
      font-size: var(--fs-md);
      text-decoration: none;
    }

    .quick-card:hover {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.08);
    }

    .quick-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #fff7e6;
      color: var(--orange);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      gap: 20px;
    }

    .tab {
      border: 0;
      background: none;
      padding: 0 0 10px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: var(--fs-sm);
      position: relative;
    }

    .tab.active {
      color: var(--primary);
      font-weight: 600;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--primary);
      border-radius: 1px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 12px 16px 16px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
    }

    .stat-icon {
      width: 32px;
      height: 32px;
      color: var(--orange);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .stat-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stat-label {
      font-size: var(--fs-xs);
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
    }

    .stat-unit {
      font-size: var(--fs-xs);
      font-weight: 400;
      color: var(--text-secondary);
    }

    .stat-up {
      font-size: 10px;
      color: #bfbfbf;
      margin-left: 2px;
    }

    .mid,
    .bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
    }

    .filters {
      display: flex;
      gap: 8px;
    }

    .select {
      position: relative;
    }

    .select-btn {
      height: 28px;
      padding: 0 10px;
      border: 1px solid #d9d9d9;
      border-radius: var(--radius-sm);
      background: #fff;
      font-size: var(--fs-xs);
      color: var(--text);
      cursor: pointer;
      min-width: 104px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .select-btn:hover,
    .select.open .select-btn {
      border-color: var(--primary);
    }

    .select-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      min-width: 100%;
      background: #fff;
      border-radius: var(--radius-sm);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      z-index: 8;
      padding: 4px 0;
    }

    .select.open .select-menu {
      display: block;
    }

    .select-menu button {
      display: block;
      width: 100%;
      border: 0;
      background: none;
      text-align: left;
      padding: 6px 12px;
      font-size: var(--fs-xs);
      cursor: pointer;
      color: var(--text);
    }

    .select-menu button:hover,
    .select-menu button.active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 16px 16px;
    }

    .metric {
      background: #f7f9fc;
      border-radius: var(--radius);
      padding: 16px 18px 14px;
      min-height: 92px;
    }

    .metric-label {
      font-size: var(--fs-sm);
      color: var(--text-secondary);
    }

    .metric-value {
      margin-top: 8px;
      font-size: var(--fs-metric);
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.3px;
    }

    .rank-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--primary);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .seg button {
      height: 28px;
      border: 0;
      background: #fff;
      color: var(--primary);
      padding: 0 10px;
      font-size: var(--fs-xs);
      cursor: pointer;
    }

    .seg button.active {
      background: var(--primary);
      color: #fff;
    }

    .podium {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 12px;
      padding: 18px 16px 8px;
    }

    .place {
      flex: 1;
      max-width: 168px;
      text-align: center;
      position: relative;
      padding: 22px 8px 12px;
      background: #fff;
      border: 1px solid #dce1e8;
      border-radius: 8px;
    }

    .place-1 { border-color: #e8c547; }
    .place-2 { border-color: #cfd6de; }
    .place-3 { border-color: #e0b08a; }

    .place-badge {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      display: grid;
      place-items: center;
      line-height: 1;
    }

    .place-1 .place-badge { background: #e8c547; }
    .place-2 .place-badge { background: #c5ced6; }
    .place-3 .place-badge { background: #d9a07a; }

    .place img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 8px;
      border: 2px solid #dce1e8;
    }

    .place-1 img {
      width: 56px;
      height: 56px;
      border-color: #e8c547;
    }

    .place-2 img { border-color: #c5ced6; }
    .place-3 img { border-color: #e0b08a; }

    .place-name {
      font-size: var(--fs-sm);
      font-weight: 600;
    }

    .place-role {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .place-amount {
      margin-top: 6px;
      color: var(--primary);
      font-weight: 700;
      font-size: 16px;
    }

    .rank-list {
      padding: 4px 16px 16px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 24px 28px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid #f0f0f0;
      font-size: var(--fs-sm);
    }

    .rank-row img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .rank-row .place-amount {
      margin-top: 0;
      font-size: var(--fs-sm);
    }

    .report-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pager {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    .pager button {
      width: 24px;
      height: 24px;
      border: 1px solid #d9d9d9;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      color: #595959;
    }

    .pager button:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .report-body {
      margin: 12px 16px 16px;
      background: #f3f8ff;
      border-radius: var(--radius);
      padding: 16px 18px;
      min-height: 128px;
    }

    .report-meta {
      color: var(--text-secondary);
      font-size: var(--fs-xs);
      margin-bottom: 12px;
    }

    .report-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 24px;
      font-size: var(--fs-sm);
    }

    .report-grid span {
      color: var(--text-secondary);
    }

    .report-amount {
      color: var(--primary);
      font-weight: 700;
    }

    .todo-list {
      padding: 4px 16px 12px;
    }

    .todo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid #f0f0f0;
      font-size: var(--fs-sm);
    }

    .todo-row:first-child {
      border-top: 0;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-panel {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      width: 260px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 8px 0;
      z-index: 10;
    }

    .dropdown.open .dropdown-panel {
      display: block;
    }

    .dropdown-panel button,
    .dropdown-panel .empty {
      display: block;
      width: 100%;
      border: 0;
      background: none;
      text-align: left;
      padding: 8px 14px;
      font-size: var(--fs-sm);
      color: var(--text);
      cursor: pointer;
    }

    .dropdown-panel .empty {
      color: var(--text-secondary);
      cursor: default;
    }

    .dropdown-panel button:hover {
      background: #f5f5f5;
    }

    @media (max-width: 1200px) {
      .quick-grid,
      .stat-row,
      .mid,
      .bottom {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 860px) {
      .quick-grid,
      .stat-row,
      .mid,
      .bottom,
      .metric-grid {
        grid-template-columns: 1fr;
      }
      .hero-date {
        display: none;
      }
    }
  </style>
</head>

          <div>
            <h1 id="greet">早上好，朱总，新的一天！要加油哦！</h1>
            <span class="todo-badge">我的待办总数：12，请优先处理哦</span>
          </div>
          <div class="hero-date" id="heroDate">2026-08-14</div>
        </section>

        <section class="card">
          <div class="section-head"><div class="section-title">快捷操作</div></div>
          <div class="quick-grid">
            <a class="quick-card" href="leads.html?add=1">
              <span class="quick-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg></span>
              快速录入线索
            </a>
            <a class="quick-card" href="leads.html?follow=1">
              <span class="quick-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H8l-4 4V5a2 2 0 012-2h13a2 2 0 012 2z"/></svg></span>
              新增跟进说明
            </a>
            <a class="quick-card" href="contracts.html?create=1">
              <span class="quick-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>
              发起合同签署
            </a>
            <a class="quick-card" href="customers.html?add=1">
              <span class="quick-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5M17 8h4M19 6v4"/></svg></span>
              添加客户维护
            </a>
          </div>
        </section>

        <section class="card">
          <div class="section-head">
            <div class="section-title">客户关联信息</div>
            <div class="tabs" id="relateTabs">
              <button class="tab" data-range="all" type="button">全部</button>
              <button class="tab" data-range="month" type="button">本月度</button>
              <button class="tab active" data-range="year" type="button">本年度</button>
            </div>
          </div>
          <div class="stat-row" id="relateStats"></div>
        </section>

        <div class="mid">
          <section class="card">
            <div class="section-head">
              <div class="section-title">数据概览</div>
              <div class="filters">
                <div class="select" data-filter="park">
                  <button class="select-btn" type="button">园区筛选 <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor"/></svg></button>
                  <div class="select-menu">
                    <button type="button" data-value="all" class="active">全部园区</button>
                    <button type="button" data-value="east">东区园区</button>
                    <button type="button" data-value="west">西区园区</button>
                  </div>
                </div>
                <div class="select" data-filter="owner">
                  <button class="select-btn" type="button">负责人筛选 <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor"/></svg></button>
                  <div class="select-menu">
                    <button type="button" data-value="all" class="active">全部负责人</button>
                    <button type="button" data-value="wu">吴芳</button>
                    <button type="button" data-value="li">李明</button>
                  </div>
                </div>
                <div class="select" data-filter="cycle">
                  <button class="select-btn" type="button">周期筛选 <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor"/></svg></button>
                  <div class="select-menu">
                    <button type="button" data-value="month">本月</button>
                    <button type="button" data-value="year" class="active">本年度</button>
                    <button type="button" data-value="quarter">本季度</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="metric-grid" id="metrics"></div>
          </section>

          <section class="card">
            <div class="section-head">
              <div class="section-title">月度业绩排行</div>
              <button class="more soon" type="button">更多</button>
            </div>
            <div class="section-head" style="padding-top:8px">
              <div class="select" data-filter="rankMonth">
                <button class="select-btn" type="button" id="monthLabel">2026年8月 <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor"/></svg></button>
                <div class="select-menu" id="monthMenu"></div>
              </div>
              <div class="rank-tools">
                <div class="seg" id="metricSeg">
                  <button class="active" data-mode="amount" type="button">业绩金额</button>
                  <button data-mode="rate" type="button">完成率</button>
                </div>
                <div class="tabs" id="rankTabs">
                  <button class="tab active" data-scope="person" type="button">个人排行</button>
                  <button class="tab" data-scope="team" type="button">团队排行</button>
                </div>
              </div>
            </div>
            <div class="podium" id="podium"></div>
            <div class="rank-list" id="rankList"></div>
          </section>
        </div>

        <div class="bottom">
          <section class="card">
            <div class="section-head">
              <div class="report-head">
                <div class="section-title">销售顾问报单 <span id="reportCount">(3)</span></div>
              </div>
              <div class="pager">
                <button type="button" id="prevReport" aria-label="上一条">‹</button>
                <button type="button" id="nextReport" aria-label="下一条">›</button>
              </div>
            </div>
            <div class="report-body" id="reportBody"></div>
          </section>

          <section class="card">
            <div class="section-head"><div class="section-title">我的待办</div></div>
            <div class="todo-list">
              <div class="todo-row">
                <span>客户资料缺失，需补充工商税务信息</span>
                <button class="btn btn-primary soon" type="button">去补充</button>
              </div>
              <div class="todo-row">
                <span>待审批代账账单</span>
                <button class="btn btn-ghost soon" type="button">跳转处理</button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script>
    const toast = (msg) => {
      const wrap = document.getElementById("toasts");
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    };

    const soonMsg = "功能即将开放";

    document.getElementById("greet").textContent = "早上好，朱总，新的一天！要加油哦！";
    document.getElementById("heroDate").textContent = "2026-08-14";

    document.querySelectorAll(".nav-group-btn").forEach((btn) => {
      btn.addEventListener("click", () => btn.parentElement.classList.toggle("open"));
    });

    document.querySelectorAll(".nav-item[data-page]").forEach((item) => {
      item.addEventListener("click", () => {
        if (item.dataset.page === "pending") {
          toast(soonMsg);
          return;
        }
        document.querySelectorAll(".nav-item").forEach((n) => n.classList.remove("active"));
        item.classList.add("active");
      });
    });

    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = btn.dataset.toggle;
        document.querySelectorAll(".dropdown").forEach((d) => {
          if (d.id !== id) d.classList.remove("open");
        });
        document.getElementById(id).classList.toggle("open");
      });
    });

    document.querySelectorAll(".select > .select-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const box = btn.parentElement;
        document.querySelectorAll(".select").forEach((s) => {
          if (s !== box) s.classList.remove("open");
        });
        box.classList.toggle("open");
      });
    });

    document.addEventListener("click", () => {
      document.querySelectorAll(".dropdown,.select").forEach((el) => el.classList.remove("open"));
    });

    document.querySelectorAll(".soon").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        toast(soonMsg);
      });
    });

    const relateIcons = [
      `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><path d="M3 19c.5-3 2.6-5 5-5s4.5 2 5 5"/><path d="M13.2 19c.4-2.4 2-4 3.8-4 2 0 3.6 1.4 4 4"/></svg>`,
      `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 5h4v14H6zM10 8h4v11h-4zM14 6h4v13h-4z"/></svg>`,
      `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 4h8l4 4v12H7z"/><path d="M15 4v4h4"/><path d="M10 14h5"/><circle cx="17" cy="17" r="3"/></svg>`,
      `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h16v3H4zm1 4h14v8H5z"/><path d="M8 16h8"/></svg>`
    ];

    const relateData = {
      year: [
        ["客户联系人", "12", "个", false],
        ["客户档案变更", "6", "次", false],
        ["跟进记录", "88", "条", false],
        ["客户项目库", "6", "个", false]
      ],
      month: [
        ["客户联系人", "4", "", true],
        ["客户档案变更", "2", "次", false],
        ["跟进记录", "21", "条", false],
        ["客户项目库", "1", "个", false]
      ],
      all: [
        ["客户联系人", "36", "", true],
        ["客户档案变更", "19", "次", false],
        ["跟进记录", "246", "条", false],
        ["客户项目库", "14", "个", false]
      ]
    };

    const renderRelate = (range) => {
      document.getElementById("relateStats").innerHTML = relateData[range]
        .map(([label, num, unit, up], i) => `
          <div class="stat-item">
            <div class="stat-icon">${relateIcons[i]}</div>
            <div class="stat-main">
              <div class="stat-label">${label}</div>
              <div class="stat-value">${num}${unit ? `<span class="stat-unit">${unit}</span>` : ""}${up ? `<span class="stat-up">▲</span>` : ""}</div>
            </div>
          </div>`)
        .join("");
    };
    renderRelate("year");

    document.querySelectorAll("#relateTabs .tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll("#relateTabs .tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        renderRelate(tab.dataset.range);
      });
    });

    const filters = { park: "all", owner: "all", cycle: "year" };
    const metricBase = {
      all: { park: 86.2, owner: 86.2, cycle: 86.2 },
      east: { park: 51.4, owner: 86.2, cycle: 86.2 },
      west: { park: 34.8, owner: 86.2, cycle: 86.2 },
      wu: { park: 86.2, owner: 29.3, cycle: 86.2 },
      li: { park: 86.2, owner: 21.6, cycle: 86.2 },
      month: { park: 86.2, owner: 86.2, cycle: 18.4 },
      quarter: { park: 86.2, owner: 86.2, cycle: 42.7 },
      year: { park: 86.2, owner: 86.2, cycle: 86.2 }
    };

    const renderMetrics = () => {
      let n = 86.2;
      if (filters.park !== "all") n = metricBase[filters.park].park;
      if (filters.owner !== "all") n = metricBase[filters.owner].owner;
      if (filters.cycle !== "year") n = metricBase[filters.cycle].cycle;
      const val = n.toFixed(1) + "万";
      const items = [
        ["业绩总额", val],
        ["续费金额", val],
        ["客户收款", val],
        ["线索转化率", val]
      ];
      document.getElementById("metrics").innerHTML = items
        .map(([k, v]) => `<div class="metric"><div class="metric-label">${k}</div><div class="metric-value">${v}</div></div>`)
        .join("");
    };
    renderMetrics();

    document.querySelectorAll(".select[data-filter]").forEach((box) => {
      box.querySelectorAll(".select-menu button").forEach((opt) => {
        opt.addEventListener("click", (e) => {
          e.stopPropagation();
          const key = box.dataset.filter;
          if (key === "rankMonth") return;
          box.querySelectorAll(".select-menu button").forEach((b) => b.classList.remove("active"));
          opt.classList.add("active");
          filters[key] = opt.dataset.value;
          box.classList.remove("open");
          renderMetrics();
        });
      });
    });

    const people = [
      { name: "吴芳", role: "网销一组", amount: 29.3, rate: 128, kind: "f1" },
      { name: "陈海", role: "网销一组", amount: 26.4, rate: 102, kind: "m1" },
      { name: "杨文", role: "常规组", amount: 25.2, rate: 96, kind: "m2" },
      { name: "李承", role: "网销一组", amount: 23.3, rate: 88, kind: "m3" },
      { name: "赵思源", role: "常规组", amount: 21.8, rate: 79, kind: "m4" }
    ];
    const teams = [
      { name: "网销一组", role: "团队", amount: 86.2, rate: 112, kind: "m1" },
      { name: "常规组", role: "团队", amount: 64.1, rate: 97, kind: "m2" },
      { name: "销售三组", role: "团队", amount: 51.8, rate: 86, kind: "m3" },
      { name: "运营一组", role: "团队", amount: 33.4, rate: 74, kind: "m4" }
    ];

    const av = (kind) => {
      const presets = {
        f1: { bg1: "#c9d6e8", bg2: "#8ea3c0", hair: "#3b2a1a", skin: "#e8c3a4", suit: "#1c1c1c", shirt: "#f4f4f4", long: true },
        m1: { bg1: "#d3dce8", bg2: "#97a8bd", hair: "#1f1a16", skin: "#d7a57d", suit: "#151515", shirt: "#f7f7f7", long: false },
        m2: { bg1: "#cfd9e6", bg2: "#8b9db5", hair: "#2a2218", skin: "#e2b48c", suit: "#20232a", shirt: "#eee", long: false },
        m3: { bg1: "#d6deea", bg2: "#9aaac0", hair: "#4a3424", skin: "#c98a62", suit: "#111", shirt: "#fff", long: false },
        m4: { bg1: "#c8d4e4", bg2: "#8496ae", hair: "#171411", skin: "#e6c2a0", suit: "#1a1f2a", shirt: "#f2f2f2", long: false }
      };
      const p = presets[kind] || presets.m1;
      const hair = p.long
        ? `<path d="M16 30c2-16 12-22 24-22s22 6 24 22v8c-6-10-14-14-24-14S22 28 16 38z" fill="${p.hair}"/><ellipse cx="40" cy="28" rx="13" ry="15" fill="${p.skin}"/>`
        : `<ellipse cx="40" cy="22" rx="16" ry="14" fill="${p.hair}"/><ellipse cx="40" cy="28" rx="12" ry="14" fill="${p.skin}"/>`;
      return `data:image/svg+xml,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.bg1}"/><stop offset="1" stop-color="${p.bg2}"/></linearGradient></defs><circle cx="40" cy="40" r="40" fill="url(#g)"/>${hair}<path d="M10 80c3-18 12-26 30-26s27 8 30 26" fill="${p.suit}"/><path d="M40 54l-7 26h14z" fill="${p.shirt}"/></svg>`
      )}`;
    };

    const rankState = { mode: "amount", scope: "person", month: 8 };

    const fmt = (row) =>
      rankState.mode === "amount" ? row.amount.toFixed(1) + "万" : row.rate + "%";

    const renderRank = () => {
      const list = rankState.scope === "person" ? people : teams;
      const [a, b, c, ...rest] = list;
      const block = (row, place) => `
        <div class="place place-${place}">
          <div class="place-badge">${place}</div>
          <img alt="" src="${av(row.kind)}" />
          <div class="place-name">${row.name}</div>
          <div class="place-role">${row.role}</div>
          <div class="place-amount">${fmt(row)}</div>
        </div>`;
      document.getElementById("podium").innerHTML = block(b, 2) + block(a, 1) + block(c, 3);
      document.getElementById("rankList").innerHTML = rest
        .map((row, i) => `<div class="rank-row"><div class="rank-no">${i + 4}</div><img alt="" src="${av(row.kind)}" /><div>${row.name}</div><div class="place-amount">${fmt(row)}</div></div>`)
        .join("");
    };
    renderRank();

    document.querySelectorAll("#metricSeg button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#metricSeg button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        rankState.mode = btn.dataset.mode;
        renderRank();
      });
    });

    document.querySelectorAll("#rankTabs .tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll("#rankTabs .tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        rankState.scope = tab.dataset.scope;
        renderRank();
      });
    });

    const monthMenu = document.getElementById("monthMenu");
    for (let m = 8; m <= 12; m++) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = `2026年${m}月`;
      if (m === 8) b.className = "active";
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        monthMenu.querySelectorAll("button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        rankState.month = m;
        document.getElementById("monthLabel").innerHTML = `2026年${m}月 <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor"/></svg>`;
        b.closest(".select").classList.remove("open");
      });
      monthMenu.appendChild(b);
    }

    const reports = [
      { time: "2026-08-14 15:35:14", dept: "销售一部", name: "lqh", type: "个体", amount: "3600.00" },
      { time: "2026-08-13 11:02:41", dept: "销售二部", name: "吴芳", type: "企业", amount: "12800.00" },
      { time: "2026-08-12 09:18:07", dept: "销售一部", name: "李明", type: "个体", amount: "2400.00" }
    ];
    let reportIndex = 0;
    const renderReport = () => {
      const r = reports[reportIndex];
      document.getElementById("reportCount").textContent = `(${reports.length})`;
      document.getElementById("reportBody").innerHTML = `
        <div class="report-meta">${r.time}</div>
        <div class="report-grid">
          <div><span>部门：</span>${r.dept}</div>
          <div><span>姓名：</span>${r.name}</div>
          <div><span>业务类型：</span>${r.type}</div>
          <div><span>收款金额：</span><span class="report-amount">${r.amount}</span></div>
        </div>`;
    };
    renderReport();
    document.getElementById("prevReport").addEventListener("click", () => {
      reportIndex = (reportIndex - 1 + reports.length) % reports.length;
      renderReport();
    });
    document.getElementById("nextReport").addEventListener("click", () => {
      reportIndex = (reportIndex + 1) % reports.length;
      renderReport();
    });
  </script>
</body>
</html>
