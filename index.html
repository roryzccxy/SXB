<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - CRM</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <script src="js/auth.js"></script>
  <script src="js/crm-store.js"></script>
  <style>
    .login-page {
      display: flex;
      min-height: 100vh;
    }
    .login-side {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-side .logo {
      font-size: var(--fs-logo);
      font-weight: 700;
      color: var(--logo);
      letter-spacing: 0.5px;
      user-select: none;
    }
    .login-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--page-pad);
    }
    .login-card {
      width: 360px;
      max-width: 100%;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 32px 28px 28px;
    }
    .login-card h1 {
      margin: 0 0 24px;
      font-size: var(--fs-lg);
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: var(--fs-xs);
      color: var(--text);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 32px;
      border: 1px solid #d9d9d9;
      border-radius: var(--radius-sm);
      padding: 0 10px;
      font-size: var(--fs-sm);
      background: #fff;
      color: var(--text);
    }
    .field input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .err {
      min-height: 20px;
      margin: 0 0 12px;
      font-size: var(--fs-xs);
      color: var(--danger);
    }
    .btn-login {
      width: 100%;
      height: 36px;
      font-size: var(--fs-md);
    }
  </style>
</head>
<body>
  <div class="toast-wrap" id="toasts"></div>
  <div class="login-page">
    <aside class="login-side">
      <div class="logo">CRM</div>
    </aside>
    <div class="login-main">
      <form class="login-card" id="loginForm" autocomplete="on">
        <h1>账号登录</h1>
        <div class="field">
          <label for="account">账号</label>
          <input id="account" name="username" type="text" placeholder="请输入账号" maxlength="32" />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" placeholder="请输入密码" maxlength="32" />
        </div>
        <p class="err" id="err"></p>
        <button class="btn btn-primary btn-login" type="submit">登录</button>
      </form>
    </div>
  </div>
  <script>
    const toast = (m) => {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = m;
      document.getElementById("toasts").appendChild(el);
      setTimeout(() => el.remove(), 1800);
    };
    const err = document.getElementById("err");
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("account").value.trim();
      const pass = document.getElementById("password").value;
      if (!user || !pass) {
        err.textContent = "请输入账号和密码";
        return;
      }
      if (!CRMAuth.login(user, pass)) {
        err.textContent = "账号或密码错误";
        toast("账号或密码错误");
        return;
      }
      location.href = "workbench.html";
    });
  </script>
</body>
</html>
