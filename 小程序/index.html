<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>工作台 - CRM</title>
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="css/mini.css" />
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="toast-wrap" id="toasts"></div>
  <div class="stage">
    <div class="phone-scale">
      <div class="phone" id="phone">
        <div class="status-bar"><span id="statusTime">9:41</span><span class="dots">CRM</span></div>
        <header class="navbar">
          <span class="nav-side placeholder"></span>
          <h1>工作台</h1>
          <span class="nav-side placeholder"></span>
        </header>
        <main class="body" id="main"></main>
        <nav class="tabbar"></nav>
      </div>
    </div>
  </div>
  <script src="../js/crm-store.js"></script>
  <script src="js/mini.js"></script>
  <script>
    Mini.mount({ tab: "workbench" });
    const u = Mini.user();
    const oid = Mini.ownerId();
    const leads = CRM.loadLeads().filter(Mini.isMineLead);
    const custs = CRM.loadCustomers().filter(Mini.isMineCust);
    const cts = CRM.loadContracts().filter(Mini.isMineCt);
    const items = CRM.loadItems().filter((x) => custs.some((c) => c.name === x.customerName));
    const books = CRM.loadBook().filter((b) => !oid || b.ownerId === oid);
    const follows = leads.reduce((n, l) => n + (l.logs || []).length, 0);
    const today = Mini.today();
    const dueLeads = leads.filter((l) => l.followResult === "following" && l.nextFollowAt && String(l.nextFollowAt).slice(0, 10) <= today);
    const expired = cts.filter((c) => c.statusId === "expired");
    const overdueBook = books.filter((b) => CRM.bookChargeState(b.chargeEnd || b.endYm).kind === "danger");
    const todos = dueLeads.length + expired.length + overdueBook.length;
    const perf = CRM.salesPerformance({ year: 2026, period: "year", personId: oid || u.id === "admin" ? "" : oid });
    const kpi = oid ? (perf.rows[0] || perf.kpis) : perf.kpis;
    const name = u.name === "用户" ? "朱总" : u.name;

    document.getElementById("main").innerHTML = `
      <section class="hero">
        <div class="hero-avatar">${(name || "U").slice(0, 1)}</div>
        <div>
          <h2>${Mini.greet()}，${name}</h2>
          <span class="todo-badge">我的待办总数：${todos}，请优先处理哦</span>
        </div>
      </section>
      <section class="card card-pad">
        <div class="section-head"><div class="section-title">快捷操作</div></div>
        <div class="quick-grid">
          <a class="quick-card" href="lead-form.html"><span class="quick-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg></span>录入线索</a>
          <a class="quick-card" href="leads.html?tab=following"><span class="quick-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H8l-4 4V5a2 2 0 012-2h13a2 2 0 012 2z"/></svg></span>写跟进</a>
          <a class="quick-card" href="contract-form.html"><span class="quick-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/></svg></span>签合同</a>
          <a class="quick-card" href="reimbursement-form.html"><span class="quick-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></span>报销</a>
        </div>
      </section>
      <section class="card card-pad">
        <div class="section-head">
          <div class="section-title">客户关联信息</div>
          <a class="link" href="customers.html">全部</a>
        </div>
        <div class="stat-grid">
          <div class="stat-item"><div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/></svg></div><div><div class="stat-label">客户档案</div><div class="stat-value">${custs.length}<span>家</span></div></div></div>
          <div class="stat-item"><div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 4h8l4 4v12H7z"/></svg></div><div><div class="stat-label">跟进记录</div><div class="stat-value">${follows}<span>条</span></div></div></div>
          <div class="stat-item"><div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5"/><path d="M4 19h16"/></svg></div><div><div class="stat-label">我的线索</div><div class="stat-value">${leads.length}<span>条</span></div></div></div>
          <div class="stat-item"><div class="stat-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="8" width="16" height="10" rx="1"/></svg></div><div><div class="stat-label">客户物品</div><div class="stat-value">${items.length}<span>件</span></div></div></div>
        </div>
      </section>
      <section class="card card-pad">
        <div class="section-head">
          <div class="section-title">数据概览</div>
          <a class="link" href="mine.html">我的业绩</a>
        </div>
        <div class="metric-row">
          <a class="metric" href="mine.html"><div class="metric-label">业绩总额</div><div class="metric-value">${Number(kpi.totalWan || 0).toFixed(1)}万</div></a>
          <a class="metric" href="contracts.html"><div class="metric-label">续费金额</div><div class="metric-value">${Number(kpi.renewWan || 0).toFixed(1)}万</div></a>
          <a class="metric" href="contracts.html"><div class="metric-label">签约金额</div><div class="metric-value">${Number(kpi.signWan || 0).toFixed(1)}万</div></a>
          <a class="metric" href="leads.html"><div class="metric-label">线索数</div><div class="metric-value">${kpi.leadCount || leads.length}</div></a>
        </div>
      </section>
      <section class="card card-pad">
        <div class="section-head"><div class="section-title">今日待跟进</div><a class="link" href="leads.html?tab=following">查看</a></div>
        ${dueLeads.slice(0, 4).map((l) => `<div class="todo-row"><span>${l.companyName || l.name || l.phone}</span><a class="btn btn-primary" href="lead-follow.html?id=${encodeURIComponent(l.id)}">去跟进</a></div>`).join("") || `<div class="empty" style="padding:16px">暂无待跟进线索</div>`}
      </section>
      <section class="card card-pad">
        <div class="section-head"><div class="section-title">我的待办</div></div>
        ${expired.slice(0, 2).map((c) => `<div class="todo-row"><span>合同 ${c.no} 已到期</span><a class="btn btn-ghost" href="contract-detail.html?id=${encodeURIComponent(c.id)}">去续费</a></div>`).join("")}
        ${overdueBook.slice(0, 2).map((b) => `<div class="todo-row"><span>${b.customerName || "客户"} 代账逾期</span><a class="btn btn-ghost" href="customer-detail.html?name=${encodeURIComponent(b.customerName || "")}">查看</a></div>`).join("")}
        ${!expired.length && !overdueBook.length ? `<div class="empty" style="padding:16px">暂无其他待办</div>` : ""}
      </section>
    `;
  </script>
</body>
</html>
