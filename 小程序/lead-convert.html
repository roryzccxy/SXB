<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>转商机 - CRM</title>
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="css/mini.css" />
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="toast-wrap" id="toasts"></div>
  <div class="stage">
    <div class="phone-scale">
      <div class="phone" id="phone">
        <div class="status-bar"><span id="statusTime">9:41</span><span class="dots">CRM</span></div>
        <header class="navbar">
          <button class="nav-side" type="button" onclick="history.back()">‹</button>
          <h1>转商机</h1>
          <span class="nav-side placeholder"></span>
        </header>
        <main class="body">
          <section class="card card-pad">
            <div class="sec-h">客户信息</div>
            <div class="form">
              <div class="field"><label>客户姓名</label><input id="o_name" class="ro" disabled /></div>
              <div class="field"><label>手机号码</label><input id="o_phone" class="ro" disabled /></div>
              <div class="field"><label>区域</label><select id="o_region" disabled></select></div>
              <div class="field"><label>行业</label><select id="o_industry" disabled></select></div>
              <div class="field"><label>来源渠道</label><select id="o_source" disabled></select></div>
              <div class="field"><label>企业形式</label><select id="o_company" disabled></select></div>
              <div class="field"><label>跟进结果</label><select id="o_result" disabled></select></div>
              <div class="field"><label>商机等级</label><select id="o_level"></select></div>
              <div class="field"><label>商机阶段</label><select id="o_stage" disabled></select></div>
              <div class="field"><label class="req">意向商品</label><select id="o_product"></select></div>
            </div>
            <div class="foot-btn">
              <button class="btn btn-ghost" type="button" onclick="history.back()">取消</button>
              <button class="btn btn-primary" type="button" id="ok">确认</button>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>
  <script src="../js/crm-store.js"></script>
  <script src="js/mini.js"></script>
  <script>
    Mini.mount();
    const id = Mini.qs("id");
    Mini.fillSel(o_region, CRM.dicts.regions, "请选择");
    Mini.fillSel(o_industry, CRM.dicts.industries, "请选择");
    Mini.fillSel(o_source, CRM.dicts.sources, "请选择");
    Mini.fillSel(o_company, CRM.dicts.companyTypes, "请选择");
    Mini.fillSel(o_result, CRM.dicts.followResults, "请选择");
    Mini.fillSel(o_level, CRM.dicts.oppLevels, "请选择");
    Mini.fillSel(o_stage, CRM.dicts.oppStages, "请选择");
    Mini.fillSel(o_product, CRM.dicts.products, "请选择");
    const row = CRM.loadLeads().find((x) => x.id === id);
    if (!row) { Mini.toast("线索不存在"); history.back(); }
    else {
      o_name.value = row.name || "";
      o_phone.value = row.phone || "";
      o_region.value = row.regionId || "";
      o_industry.value = row.industryId || "";
      o_source.value = row.sourceId || "";
      o_company.value = row.companyTypeId || "";
      o_result.value = "opportunity";
      o_stage.value = "intent";
      o_level.value = row.oppLevelId || "A";
      o_product.value = row.productId || "";
    }
    document.getElementById("ok").onclick = () => {
      if (!o_product.value) { Mini.toast("请选择意向商品"); return; }
      const leads = CRM.loadLeads();
      const r = leads.find((x) => x.id === id);
      const first = r.followResult !== "opportunity";
      r.followResult = "opportunity";
      r.oppStageId = "intent";
      r.oppLevelId = o_level.value;
      r.productId = o_product.value;
      r.contact = r.contact || r.name;
      r.lastFollowAt = Mini.now();
      r.logs = r.logs || [];
      r.logs.unshift({
        at: r.lastFollowAt,
        type: "follow",
        status: "opportunity",
        user: Mini.user().name,
        text: `转商机：意向商机 / 等级${r.oppLevelId} / ${CRM.dictName("products", r.productId)}`
      });
      if (first) CRM.bumpMetric(r.ownerId, "oppActual", 1);
      CRM.saveLeads(leads);
      CRM.upsertOppFromLead(r);
      Mini.toast(first ? "已转商机，并计入营销目标" : "商机信息已更新");
      setTimeout(() => Mini.openCustomer({ name: r.companyName || r.name, leadId: r.id, phone: r.phone }), 400);
    };
  </script>
</body>
</html>
