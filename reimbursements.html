<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>财务报销 - CRM</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <script src="js/auth.js"></script>
  <style>
    .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
    .kpi { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px 14px; border-top: 3px solid var(--primary); }
    .kpi.orange { border-top-color: var(--orange); }
    .kpi.green { border-top-color: var(--success); }
    .kpi.red { border-top-color: var(--danger); }
    .kpi-label { font-size: var(--fs-sm); color: var(--text-secondary); }
    .kpi-val { font-size: 24px; font-weight: 700; line-height: 1.3; margin: 6px 0 4px; letter-spacing: -0.4px; }
    .kpi-sub { font-size: var(--fs-xs); color: var(--text-secondary); }
    .kpi-sub .up { color: var(--success); }
    .kpi-sub .down { color: var(--danger); }
    .toolbar { padding: 16px; }
    .filter-grid { display: grid; grid-template-columns: auto 1fr auto 1fr auto 1fr auto 1fr auto 1fr auto; gap: 10px 8px; align-items: center; }
    .filter-grid label { font-size: var(--fs-sm); color: var(--text); text-align: right; white-space: nowrap; }
    .filter-grid input, .filter-grid select { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .filter-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-md { height: 32px; padding: 0 14px; font-size: var(--fs-sm); }
    .list-card { overflow: auto; }
    .list-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .list-head h3 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
    .list-head .count { color: var(--text-secondary); font-size: var(--fs-xs); font-weight: 400; margin-left: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px 8px; text-align: left; border-top: 1px solid #f0f0f0; white-space: nowrap; }
    th { background: #fafafa; color: var(--text-secondary); font-weight: 600; }
    .money { font-weight: 600; }
    .reason { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    .ops button, .ops a { border: 0; background: none; color: var(--primary); cursor: pointer; font-size: 12px; padding: 0 8px 0 0; text-decoration: none; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .tag-travel { background: #e6f4ff; color: var(--primary); }
    .tag-ent { background: #f9f0ff; color: #722ed1; }
    .tag-office { background: #fff7e6; color: #d48806; }
    .tag-traffic { background: #e6fffb; color: #13c2c2; }
    .tag-other { background: #f5f5f5; color: #595959; }
    .st-wait { color: var(--orange); font-weight: 600; }
    .st-pass { color: var(--success); font-weight: 600; }
    .st-reject { color: var(--danger); font-weight: 600; }
    .pager-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: var(--fs-xs); color: var(--text-secondary); }
    .pager-right { display: flex; align-items: center; gap: 6px; }
    .pager-bar button { min-width: 24px; height: 24px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; }
    .pager-bar button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager-bar button:disabled { opacity: 0.45; cursor: default; }
    .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: center; justify-content: center; padding: 16px; }
    .mask.show { display: flex; }
    .modal { width: 760px; max-width: 100%; background: #fff; border-radius: var(--radius); max-height: calc(100vh - 24px); overflow: auto; position: relative; }
    .modal.wide { width: 820px; }
    .modal-head { height: 44px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; font-weight: 600; z-index: 1; }
    .modal-close { position: absolute; right: 12px; top: 0; height: 44px; border: 0; background: none; color: #fff; font-size: 22px; cursor: pointer; }
    .modal-close.dark { color: #8c8c8c; height: 40px; top: 8px; z-index: 2; }
    .modal-body { padding: 18px 22px 8px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 22px 20px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .field label { display: block; font-size: var(--fs-xs); color: var(--text); margin-bottom: 6px; }
    .field .lab { font-size: var(--fs-xs); color: var(--text-secondary); margin-bottom: 4px; }
    .field .val { font-size: var(--fs-sm); color: var(--text); }
    .field .val.danger { color: var(--danger); font-weight: 700; }
    .field .val.ok { color: var(--success); font-weight: 600; }
    .field input, .field select, .field textarea { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .field textarea { height: 72px; padding: 8px; resize: vertical; }
    .ro { background: #f5f5f5 !important; }
    .full { grid-column: 1 / -1; }
    .unit-wrap { position: relative; }
    .unit-wrap input { padding-right: 28px; }
    .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-secondary); }
    .upload { border: 1px dashed #d9d9d9; border-radius: var(--radius-sm); padding: 22px; text-align: center; color: var(--text-secondary); cursor: pointer; background: #fafafa; }
    .upload strong { display: block; color: var(--text); font-weight: 500; margin: 6px 0 4px; }
    .upload input { display: none; }
    .files { margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
    .banner { padding: 16px 22px; display: flex; align-items: center; gap: 12px; }
    .banner.pass { background: #f6ffed; }
    .banner.wait { background: #fff7e6; }
    .banner.reject { background: #fff1f0; }
    .banner-ico { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; flex-shrink: 0; }
    .banner.pass .banner-ico { background: var(--success); }
    .banner.wait .banner-ico { background: var(--orange); }
    .banner.reject .banner-ico { background: var(--danger); }
    .banner h4 { margin: 0; font-size: 16px; }
    .banner.pass h4 { color: var(--success); }
    .banner.wait h4 { color: var(--orange); }
    .banner.reject h4 { color: var(--danger); }
    .banner p { margin: 2px 0 0; font-size: 12px; color: var(--text-secondary); }
    .sec { margin: 16px 0 8px; }
    .sec h5 { margin: 0 0 12px; font-size: var(--fs-md); font-weight: 600; border-left: 3px solid var(--primary); padding-left: 8px; }
    .file-row { display: flex; align-items: center; gap: 12px; background: #fafafa; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; font-size: 12px; }
    .file-row .pdf { color: var(--primary); font-weight: 600; width: 36px; }
    .file-row .fn { flex: 1; }
    .file-row .meta { color: var(--text-secondary); }
    .file-row a { color: var(--primary); text-decoration: none; }
    .tl { border-left: 2px solid #e8e8e8; margin-left: 6px; padding-left: 16px; }
    .tl-item { position: relative; padding-bottom: 14px; font-size: 12px; }
    .tl-item::before { content: ""; position: absolute; left: -21px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .tl-item .who { color: var(--text); font-weight: 600; }
    .tl-item .txt { color: var(--text-secondary); margin-top: 2px; }
    .radios { display: flex; gap: 20px; font-size: var(--fs-sm); }
    .field a { color: var(--primary); }
    @media (max-width: 1200px) { .kpi-row { grid-template-columns: 1fr 1fr; } .filter-grid { grid-template-columns: auto 1fr auto 1fr; } .filter-actions { grid-column: 1 / -1; } }
    @media print { .sidebar, .header, .toolbar, .kpi-row, .list-card, .modal-foot, .modal-head, .mask { display: none !important; } .mask.show { display: block !important; position: static; background: none; } .modal { box-shadow: none; max-height: none; } }
  </style>
</head>

  <div class="mask" id="addMask">
    <div class="modal">
      <div class="modal-head">新建报销申请<button class="modal-close" data-close="addMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two">
          <div class="field"><label>报销编号</label><input id="r_no" class="ro" disabled /></div>
          <div class="field"><label>申请人</label><input id="r_man" list="peopleList" placeholder="请输入申请人" /></div>
          <div class="field"><label>部门</label><input id="r_dept" class="ro" disabled placeholder="选择申请人后带出" /></div>
          <div class="field"><label>报销类型</label><select id="r_type"></select></div>
          <div class="field"><label>报销金额</label><div class="unit-wrap"><input id="r_amt" type="number" min="0" placeholder="请输入金额" /><span class="unit">元</span></div></div>
          <div class="field"><label>发票张数</label><div class="unit-wrap"><input id="r_inv" type="number" min="0" placeholder="请输入张数" /><span class="unit">张</span></div></div>
          <div class="field"><label>申请日期</label><input id="r_date" type="date" min="2026-08-01" /></div>
          <div class="field"><label>审批人</label><input id="r_ap" list="peopleList" placeholder="匹配审批人" /></div>
          <div class="field full"><label>关联客户</label><input id="r_cust" list="custList" placeholder="招待/差旅可匹配客户库（选填）" /></div>
          <div class="field full"><label>报销事由</label><textarea id="r_why" placeholder="请输入报销事由"></textarea></div>
          <div class="field full"><label>备注</label><textarea id="r_note" placeholder="请输入备注信息（选填）"></textarea></div>
          <div class="field full">
            <label>附件上传</label>
            <label class="upload">
              <input id="r_file" type="file" accept=".jpg,.jpeg,.png,.pdf" multiple />

              <strong>点击或拖拽上传发票照片</strong>
              <span>支持 jpg/png/pdf 格式，单个文件不超过10MB</span>
            </label>
            <div class="files" id="r_files"></div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="addMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="addOk" type="button">提交申请</button>

  <script src="js/crm-store.js"></script>
  <script>
    const toast = (m) => { const el = document.createElement("div"); el.className = "toast"; el.textContent = m; document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 1800); };
    document.querySelectorAll(".nav-group-btn").forEach((b) => b.addEventListener("click", () => b.parentElement.classList.toggle("open")));
    document.querySelectorAll("[data-page=pending],.soon").forEach((el) => el.addEventListener("click", () => toast("功能即将开放")));
    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); document.querySelectorAll(".dropdown").forEach((d) => d.classList.toggle("open", d.id === btn.dataset.toggle && !d.classList.contains("open"))); });
    });
    document.addEventListener("click", () => document.querySelectorAll(".dropdown").forEach((d) => d.classList.remove("open")));
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => document.getElementById(b.dataset.close).classList.remove("show")));

    const $ = (id) => document.getElementById(id);
    const fillSel = (el, list, all) => { el.innerHTML = `<option value="">${all}</option>` + list.map((x) => `<option value="${x.id}">${x.name}</option>`).join(""); };
    fillSel($("fType"), CRM.dicts.reimbTypes, "请选择");
    fillSel($("fStatus"), CRM.dicts.reimbStatuses, "请选择");
    fillSel($("r_type"), CRM.dicts.reimbTypes, "请选择");
    const dlP = document.createElement("datalist");
    dlP.id = "peopleList";
    dlP.innerHTML = CRM.dicts.people.map((p) => `<option value="${p.name}"></option>`).join("");
    document.body.appendChild(dlP);
    const dlC = document.createElement("datalist");
    dlC.id = "custList";
    dlC.innerHTML = CRM.reimbCustHint().map((n) => `<option value="${n}"></option>`).join("");
    document.body.appendChild(dlC);

    const yuan = (n) => "¥" + Number(n || 0).toLocaleString("zh-CN");
    const wan1 = (n) => (Math.round(Number(n || 0) / 1000) / 10).toFixed(1);
    let list = CRM.loadReimbs();
    let page = 1;
    const pageSize = 10;
    let query = {};
    let pendingFiles = [];
    let viewId = null;
    let apId = null;

    const personOf = (name) => CRM.dicts.people.find((p) => p.name === name);

    const fillDept = () => {
      const p = personOf($("r_man").value.trim());
      $("r_dept").value = p ? (CRM.dept(p.deptId) || {}).name || "" : "";
    };

    const filtered = () => list.filter((x) => {
      if (query.no && !(x.no || "").includes(query.no)) return false;
      if (query.man && !((CRM.person(x.applicantId) || {}).name || "").includes(query.man)) return false;
      if (query.type && x.typeId !== query.type) return false;
      if (query.status && x.statusId !== query.status) return false;
      if (query.date && x.applyAt !== query.date) return false;
      if (query.month && !(x.applyAt || "").startsWith(query.month)) return false;
      return true;
    });

    const renderKpi = () => {
      const s = CRM.reimbStats(list);
      const momUp = s.mom >= 0;
      $("kpis").innerHTML = `
        <div class="kpi"><div class="kpi-label">本月报销总额</div><div class="kpi-val">${wan1(s.monthYuan)} 万</div><div class="kpi-sub">上月 ${wan1(s.lastYuan)}万 <span class="${momUp ? "up" : "down"}">${momUp ? "↑" : "↓"} ${Math.abs(s.mom * 100).toFixed(1)}%</span></div></div>
        <div class="kpi orange"><div class="kpi-label">待审批</div><div class="kpi-val">${s.wait.length} 笔</div><div class="kpi-sub">金额：${yuan(s.waitSum)}</div></div>
        <div class="kpi green"><div class="kpi-label">已通过</div><div class="kpi-val">${s.pass.length} 笔</div><div class="kpi-sub">金额：¥${wan1(s.passSum)}万</div></div>
        <div class="kpi red"><div class="kpi-label">已驳回</div><div class="kpi-val">${s.reject.length} 笔</div><div class="kpi-sub">金额：${yuan(s.rejectSum)}</div></div>`;
    };

    const render = () => {
      renderKpi();
      const rows = filtered();
      const pages = Math.max(1, Math.ceil(rows.length / pageSize));
      if (page > pages) page = pages;
      $("listCount").textContent = `共 ${rows.length} 条`;
      $("pageInfo").textContent = `共 ${rows.length} 条`;
      $("tbody").innerHTML = rows.slice((page - 1) * pageSize, page * pageSize).map((x) => {
        const man = (CRM.person(x.applicantId) || {}).name || "—";
        const ap = (CRM.person(x.approverId) || {}).name || "—";
        const ops = x.statusId === "wait"
          ? `<button data-act="ap" data-id="${x.id}" type="button">审批</button><button data-act="view" data-id="${x.id}" type="button">详情</button>`
          : `<button data-act="view" data-id="${x.id}" type="button">详情</button>`;
        return `<tr>
          <td>${x.no}</td><td>${man}</td><td>${CRM.dictName("depts", x.deptId)}</td>
          <td><span class="tag tag-${x.typeId}">${CRM.dictName("reimbTypes", x.typeId)}</span></td>
          <td class="money">${yuan(x.amount)}</td><td>${x.invoices || 0}</td><td>${x.applyAt || "—"}</td>
          <td class="st-${x.statusId}">${CRM.dictName("reimbStatuses", x.statusId)}</td>
          <td>${ap}</td><td class="reason" title="${x.reason || ""}">${x.reason || "—"}</td>
          <td class="ops">${ops}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="11">暂无报销</td></tr>`;
      const prev = page <= 1 ? "disabled" : "";
      const next = page >= pages ? "disabled" : "";
      $("pages").innerHTML = `<button type="button" data-p="${page - 1}" ${prev}>‹</button>` +
        Array.from({ length: pages }, (_, i) => `<button class="${i + 1 === page ? "on" : ""}" data-p="${i + 1}" type="button">${i + 1}</button>`).join("") +
        `<button type="button" data-p="${page + 1}" ${next}>›</button>`;
    };

    const persist = () => { CRM.saveReimbs(list); render(); };
    const hit = (id) => list.find((x) => x.id === id);

    $("r_man").addEventListener("change", fillDept);
    $("r_file").addEventListener("change", () => {
      pendingFiles = [...$("r_file").files].map((f) => ({ name: f.name, amount: 0, date: $("r_date").value || "2026-08-31" }));
      $("r_files").textContent = pendingFiles.length ? pendingFiles.map((f) => f.name).join("、") : "";
    });

    const openAdd = () => {
      const day = "2026-08-31";
      $("r_no").value = CRM.nextReimbNo(list, day);
      $("r_man").value = "陈海";
      fillDept();
      $("r_type").value = "";
      $("r_amt").value = $("r_inv").value = $("r_why").value = $("r_note").value = $("r_cust").value = "";
      $("r_date").value = day;
      $("r_ap").value = "朱总";
      pendingFiles = [];
      $("r_files").textContent = "";
      $("addMask").classList.add("show");
    };

    $("btnAdd").addEventListener("click", openAdd);
    $("addOk").addEventListener("click", () => {
      const p = personOf($("r_man").value.trim());
      const ap = personOf($("r_ap").value.trim());
      const typeId = $("r_type").value;
      const amount = Number($("r_amt").value || 0);
      const applyAt = $("r_date").value;
      const reason = $("r_why").value.trim();
      if (!p || !typeId || !reason) { toast("请填写申请人、类型和事由"); return; }
      if (!(amount > 0)) { toast("请填写报销金额"); return; }
      if (!applyAt) { toast("请选择申请日期"); return; }
      let customerName = $("r_cust").value.trim();
      if (!customerName) customerName = (CRM.reimbCustHint().find((n) => reason.includes(n)) || "");
      const invoices = Number($("r_inv").value || pendingFiles.length || 0);
      const row = {
        id: "rb-" + Date.now(),
        no: $("r_no").value,
        applicantId: p.id,
        deptId: p.deptId,
        typeId,
        amount,
        invoices,
        applyAt,
        statusId: "wait",
        approverId: ap ? ap.id : "zhu",
        approvedAt: "",
        reason,
        remark: $("r_note").value.trim(),
        customerName,
        files: pendingFiles.map((f, i) => ({ name: f.name, amount: i === 0 ? amount : 0, date: applyAt })),
        logs: [{ at: applyAt + " 09:12", user: p.name, title: "提交申请", text: "提交" + CRM.dictName("reimbTypes", typeId) + "报销申请，金额" + yuan(amount) }]
      };
      list.unshift(row);
      persist();
      $("addMask").classList.remove("show");
      toast("已提交，待朱总审批");
    });

    const openView = (id) => {
      const x = hit(id);
      if (!x) return;
      viewId = id;
      const man = (CRM.person(x.applicantId) || {}).name || "—";
      const ap = (CRM.person(x.approverId) || {}).name || "—";
      const st = x.statusId;
      const title = st === "pass" ? "审批通过" : st === "reject" ? "审批驳回" : "待审批";
      const sub = st === "wait" ? (man + " 已提交，等待 " + ap + " 审批") : (ap + " 于 " + (x.approvedAt || "—") + (st === "pass" ? " 审批通过" : " 审批驳回"));
      $("viewBanner").innerHTML = `<div class="banner ${st}"><div class="banner-ico">${st === "pass" ? "✓" : st === "reject" ? "!" : "…"}</div><div><h4>${title}</h4><p>${sub}</p></div></div>`;
      const custLink = x.customerName ? `<a href="customers.html?name=${encodeURIComponent(x.customerName)}">${x.customerName}</a>` : "—";
      $("viewGrid").innerHTML = [
        ["报销编号", x.no], ["报销类型", CRM.dictName("reimbTypes", x.typeId)],
        ["申请人", man], ["部门", CRM.dictName("depts", x.deptId)],
        ["申请日期", x.applyAt || "—"], ["审批状态", `<span class="val ${st === "pass" ? "ok" : st === "reject" ? "danger" : ""}">${CRM.dictName("reimbStatuses", st)}</span>`],
        ["报销金额", `<span class="val danger">${yuan(x.amount)}</span>`], ["发票张数", (x.invoices || 0) + " 张"],
        ["审批人", ap], ["审批时间", x.approvedAt || "—"],
        ["关联客户", custLink], ["", ""]
      ].map(([k, v]) => k ? `<div class="field"><div class="lab">${k}</div><div class="val">${v}</div></div>` : "").join("") +
        `<div class="field full"><div class="lab">报销事由</div><div class="val">${x.reason || "—"}</div></div>` +
        `<div class="field full"><div class="lab">备注</div><div class="val">${x.remark || "—"}</div></div>`;
      const files = x.files || [];
      $("fileTitle").textContent = "发票附件（" + files.length + "张）";
      $("viewFiles").innerHTML = files.length ? files.map((f) => `<div class="file-row"><span class="pdf">PDF</span><span class="fn">${f.name}</span><span class="meta">${yuan(f.amount || 0)}</span><span class="meta">${f.date || ""}</span><a href="#" data-fn="${f.name}">查看</a></div>`).join("") : "<div class='files'>暂无附件</div>";
      $("viewTl").innerHTML = (x.logs || []).map((l) => `<div class="tl-item"><div class="who">${l.title}　${l.user} · ${l.at}</div><div class="txt">${l.text || ""}</div></div>`).join("") || "暂无流程";
      $("viewMask").classList.add("show");
    };

    const openAp = (id) => {
      const x = hit(id);
      if (!x || x.statusId !== "wait") { toast("仅待审批单据可审批"); return; }
      apId = id;
      const man = (CRM.person(x.applicantId) || {}).name || "—";
      $("apGrid").innerHTML = [
        ["报销编号", x.no], ["申请人", man],
        ["部门", CRM.dictName("depts", x.deptId)], ["报销类型", CRM.dictName("reimbTypes", x.typeId)],
        ["报销金额", yuan(x.amount)], ["发票张数", (x.invoices || 0) + " 张"],
        ["申请日期", x.applyAt || "—"], ["关联客户", x.customerName || "—"]
      ].map(([k, v]) => `<div class="field"><label>${k}</label><input class="ro" disabled value="${v}" /></div>`).join("") +
        `<div class="field full"><label>报销事由</label><textarea class="ro" disabled>${x.reason || ""}</textarea></div>`;
      $("ap_note").value = "";
      document.querySelector('input[name=apRes][value=pass]').checked = true;
      $("apMask").classList.add("show");
    };

    $("apOk").addEventListener("click", () => {
      const x = hit(apId);
      if (!x) return;
      const pass = (document.querySelector('input[name=apRes]:checked') || {}).value === "pass";
      const note = $("ap_note").value.trim() || (pass ? "费用合理，同意报销" : "不符合报销标准，驳回");
      x.statusId = pass ? "pass" : "reject";
      x.approvedAt = "2026-08-31 16:30";
      x.logs = x.logs || [];
      x.logs.push({ at: x.approvedAt, user: "朱总", title: pass ? "审批通过" : "审批驳回", text: note });
      if (pass) x.logs.push({ at: "2026-08-31 17:00", user: "财务部", title: "财务打款", text: "已通过银行转账打款" + yuan(x.amount) + "至申请人账户" });
      CRM.recordReimbBiz(x, pass ? "审批通过" : "审批驳回");
      $("apMask").classList.remove("show");
      persist();
      toast(pass ? "已通过，招待/差旅将回写客户跟进" : "已驳回");
    });

    $("tbody").addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      if (b.dataset.act === "view") openView(b.dataset.id);
      if (b.dataset.act === "ap") openAp(b.dataset.id);
    });
    $("viewFiles").addEventListener("click", (e) => {
      if (e.target.dataset.fn) { e.preventDefault(); toast("附件预览即将开放"); }
    });
    $("btnPrint").addEventListener("click", () => window.print());

    $("btnQuery").addEventListener("click", () => {
      query = { no: $("fNo").value.trim(), man: $("fMan").value.trim(), type: $("fType").value, status: $("fStatus").value, date: $("fDate").value };
      page = 1; render();
    });
    $("btnReset").addEventListener("click", () => {
      $("fNo").value = $("fMan").value = $("fType").value = $("fStatus").value = $("fDate").value = "";
      query = {}; page = 1; render();
    });
    $("pages").addEventListener("click", (e) => {
      const b = e.target.closest("[data-p]");
      if (!b || b.disabled) return;
      const n = Number(b.dataset.p);
      if (n >= 1) { page = n; render(); }
    });

    const qs = new URLSearchParams(location.search);
    if (qs.get("person")) {
      const p = CRM.person(qs.get("person")) || CRM.dicts.people.find((x) => x.name === qs.get("person"));
      $("fMan").value = p ? p.name : qs.get("person");
      query.man = $("fMan").value;
    }
    if (qs.get("status")) { $("fStatus").value = qs.get("status"); query.status = qs.get("status"); }
    if (qs.get("month")) query.month = qs.get("month");
    if (qs.get("no")) { $("fNo").value = qs.get("no"); query.no = qs.get("no"); }
    if (qs.get("add") === "1") openAdd();
    render();
  </script>
</body>
</html>
