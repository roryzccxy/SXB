<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人事管理 - CRM</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <script src="js/auth.js"></script>
  <style>
    .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
    .kpi { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px 14px; border-top: 3px solid var(--primary); }
    .kpi.green { border-top-color: var(--success); }
    .kpi.orange { border-top-color: var(--orange); }
    .kpi.red { border-top-color: var(--danger); }
    .kpi-label { font-size: var(--fs-sm); color: var(--text-secondary); }
    .kpi-val { font-size: 24px; font-weight: 700; line-height: 1.3; margin: 6px 0 4px; letter-spacing: -0.4px; }
    .kpi-val .u { font-size: 13px; font-weight: 600; margin-left: 4px; color: var(--text-secondary); }
    .kpi-sub { font-size: var(--fs-xs); color: var(--text-secondary); }
    .toolbar { padding: 16px; margin-bottom: 16px; }
    .filter-grid { display: grid; grid-template-columns: auto 1fr auto 1fr auto 1fr auto 1fr auto 1fr auto 1fr auto; gap: 10px 8px; align-items: center; }
    .filter-grid label { font-size: var(--fs-sm); color: var(--text); text-align: right; white-space: nowrap; }
    .filter-grid input, .filter-grid select { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .dates { display: flex; align-items: center; gap: 6px; }
    .dates span { color: var(--text-secondary); font-size: 12px; }
    .filter-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-md { height: 32px; padding: 0 14px; font-size: var(--fs-sm); }
    .list-card { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px 8px; text-align: left; border-top: 1px solid #f0f0f0; white-space: nowrap; }
    th { background: #fafafa; color: var(--text-secondary); font-weight: 600; }
    .ops button { border: 0; background: none; color: var(--primary); cursor: pointer; font-size: 12px; padding: 0 10px 0 0; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .st-active { background: #f6ffed; color: var(--success); }
    .st-probation { background: #fff7e6; color: var(--orange); }
    .st-expiring { background: #fff1f0; color: var(--danger); }
    .st-left { background: #f5f5f5; color: #595959; }
    .pager-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: var(--fs-xs); color: var(--text-secondary); }
    .pager-right { display: flex; align-items: center; gap: 6px; }
    .pager-bar button { min-width: 24px; height: 24px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; }
    .pager-bar button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager-bar button:disabled { opacity: 0.45; cursor: default; }
    .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: center; justify-content: center; padding: 16px; }
    .mask.show { display: flex; }
    .modal { width: 760px; max-width: 100%; background: #fff; border-radius: var(--radius); max-height: calc(100vh - 24px); overflow: auto; position: relative; }
    .modal-head { height: 44px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; font-weight: 600; z-index: 1; }
    .modal-close { position: absolute; right: 12px; top: 0; height: 44px; border: 0; background: none; color: #fff; font-size: 22px; cursor: pointer; }
    .modal-body { padding: 18px 22px 8px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 22px 20px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .field label { display: block; font-size: var(--fs-xs); color: var(--text-secondary); margin-bottom: 6px; }
    .field input, .field select, .field textarea { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .field textarea { height: 72px; padding: 8px; resize: vertical; }
    .ro { background: #f5f5f5 !important; }
    .full { grid-column: 1 / -1; }
    .links { font-size: 12px; margin: 4px 0 8px; }
    .links a { color: var(--primary); text-decoration: none; margin-right: 16px; }
    @media (max-width: 1200px) { .kpi-row { grid-template-columns: 1fr 1fr; } .filter-grid { grid-template-columns: auto 1fr auto 1fr; } .filter-actions { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div class="toast-wrap" id="toasts"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">CRM</div>
      <nav class="nav">
        <a class="nav-item" href="workbench.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          工作台
        </a>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16l3-4 3 2 4-6"/></svg>销售中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="marketing-goals.html">营销目标</a>
            <a class="nav-item" href="leads.html">线索管理</a>
            <a class="nav-item" href="opportunities.html">商机管理</a>
            <a class="nav-item" href="contracts.html">合同管理</a>
            <a class="nav-item" href="customers.html">客户管理</a>
            <a class="nav-item" href="sales-performance.html">销售业绩</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M4 19c.5-3 2.8-5 5-5s4.5 2 5 5"/><path d="M16 8h5M18.5 5.5v5"/></svg>客户中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <button class="nav-item" data-page="pending" type="button">政务服务</button>
            <button class="nav-item" data-page="pending" type="button">代账服务</button>
            <a class="nav-item" href="addresses.html">地址管理</a>
            <a class="nav-item" href="customer-items.html">客户物品</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>运营中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="reimbursements.html">财务报销</a>
            <a class="nav-item" href="reports.html">经营报表</a>
            <a class="nav-item active" href="personnel.html">人事管理</a>
            <a class="nav-item" href="salary.html">薪资管理</a>
            <a class="nav-item" href="employees.html">员工管理</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>系统管理</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="roles.html">角色权限</a>
            <button class="nav-item" data-page="pending" type="button">字典管理</button>
            <button class="nav-item" data-page="pending" type="button">菜单管理</button>
          </div>
        </div>
      </nav>
    </aside>
    <div class="main">
      <header class="header">
        <div class="dropdown" id="mailDrop">
          <button class="icon-btn" type="button" data-toggle="mailDrop" aria-label="消息"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></button>
          <div class="dropdown-panel"><div class="empty">暂无新消息</div></div>
        </div>
        <button class="icon-btn soon" type="button" aria-label="帮助"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 17v-1M12 8a2.2 2.2 0 0 1 1 4c-.6.5-1 1-1 2"/></svg></button>
        <div class="dropdown" id="userDrop">
          <button class="user-chip" type="button" data-toggle="userDrop"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 19c1-4 3.5-6 7-6s6 2 7 6"/></svg>用户</button>
          <div class="dropdown-panel"><button type="button" class="soon">个人中心</button><button type="button" data-logout>退出登录</button></div>
        </div>
      </header>
      <main class="content">
        <div class="kpi-row" id="kpis"></div>
        <section class="card toolbar">
          <div class="filter-grid">
            <label title="来源：员工档案姓名。去处：列表筛选。">员工姓名</label><input id="fName" placeholder="请输入" />
            <label title="来源：部门字典，与报销/业绩/报表共用。">部门</label><select id="fDept"></select>
            <label>岗位</label><select id="fPost"></select>
            <label>在职状态</label><select id="fStatus"></select>
            <label>入职日期</label>
            <div class="dates">
              <input id="fFrom" type="date" />
              <span>至</span>
              <input id="fTo" type="date" />
            </div>
            <div class="filter-actions">
              <button class="btn btn-ghost btn-md" id="btnReset" type="button">重置</button>
              <button class="btn btn-primary btn-md" id="btnQuery" type="button">查询</button>
            </div>
          </div>
        </section>
        <section class="card list-card">
          <table>
            <thead>
              <tr>
                <th>EMP编号</th><th>姓名</th><th>部门</th><th>岗位</th>
                <th>入职日期</th><th>转正日期</th><th>合同到期</th>
                <th>联系电话</th><th>学历</th><th>状态</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="pager-bar">

            <div class="pager-right" id="pages"></div>
          </div>
        </section>
      </main>
    </div>

  <div class="mask" id="editMask">
    <div class="modal">
      <div class="modal-head">编辑员工信息<button class="modal-close" data-close="editMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="links" id="editLinks"></div>
        <div class="two">
          <div class="field"><label>员工编号</label><input id="e_no" class="ro" disabled /></div>
          <div class="field"><label>姓名</label><input id="e_name" /></div>
          <div class="field"><label>性别</label><select id="e_gender"></select></div>
          <div class="field"><label>部门</label><select id="e_dept"></select></div>
          <div class="field"><label>岗位</label><select id="e_post"></select></div>
          <div class="field"><label>联系电话</label><input id="e_phone" /></div>
          <div class="field"><label>入职日期</label><input id="e_entry" type="date" /></div>
          <div class="field"><label>转正日期</label><input id="e_convert" type="date" /></div>
          <div class="field"><label>合同到期</label><input id="e_end" type="date" /></div>
          <div class="field"><label>学历</label><select id="e_edu"></select></div>
          <div class="field"><label>状态</label><select id="e_status"></select></div>
          <div class="field"><label>身份证号</label><input id="e_idno" /></div>
          <div class="field"><label>紧急联系人</label><input id="e_em_name" /></div>
          <div class="field"><label>紧急联系电话</label><input id="e_em_phone" /></div>
          <div class="field full"><label>住址</label><input id="e_addr" /></div>
          <div class="field full"><label>备注</label><textarea id="e_remark" placeholder="请输入备注信息"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="editMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="btnSaveEdit" type="button">保存</button>
      </div>
    </div>
  </div>

  <div class="mask" id="renewMask">
    <div class="modal">
      <div class="modal-head">劳动合同续签<button class="modal-close" data-close="renewMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two">
          <div class="field"><label>员工编号</label><input id="r_no" class="ro" disabled /></div>
          <div class="field"><label>姓名</label><input id="r_name" class="ro" disabled /></div>
          <div class="field"><label>部门</label><input id="r_dept" class="ro" disabled /></div>
          <div class="field"><label>岗位</label><select id="r_post"></select></div>
          <div class="field"><label>当前合同到期</label><input id="r_old" class="ro" disabled /></div>
          <div class="field"><label>续签后到期</label><input id="r_end" type="date" min="2026-08-01" /></div>
          <div class="field full"><label>续签说明</label><textarea id="r_remark" placeholder="请输入续签说明，如期限、岗位或薪资约定"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="renewMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="btnSaveRenew" type="button">确认续签</button>
      </div>
    </div>
  </div>

  <div class="mask" id="convMask">
    <div class="modal">
      <div class="modal-head">试用期转正<button class="modal-close" data-close="convMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two">
          <div class="field"><label>员工编号</label><input id="c_no" class="ro" disabled /></div>
          <div class="field"><label>姓名</label><input id="c_name" class="ro" disabled /></div>
          <div class="field"><label>部门</label><input id="c_dept" class="ro" disabled /></div>
          <div class="field"><label>岗位</label><input id="c_post" class="ro" disabled /></div>
          <div class="field"><label>入职日期</label><input id="c_entry" class="ro" disabled /></div>
          <div class="field"><label>转正日期</label><input id="c_date" type="date" min="2026-08-01" /></div>
          <div class="field full"><label>转正考核说明</label><textarea id="c_remark" placeholder="请输入试用期表现与转正意见"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="convMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="btnSaveConv" type="button">确认转正</button>
      </div>
    </div>
  </div>

  <script src="js/crm-store.js"></script>
  <script>
    const toast = (m) => { const el = document.createElement("div"); el.className = "toast"; el.textContent = m; document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 1800); };
    document.querySelectorAll(".nav-group-btn").forEach((b) => b.addEventListener("click", () => b.parentElement.classList.toggle("open")));
    document.querySelectorAll("[data-page=pending],.soon").forEach((el) => el.addEventListener("click", () => toast("功能即将开放")));
    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); document.querySelectorAll(".dropdown").forEach((d) => d.classList.toggle("open", d.id === btn.dataset.toggle && !d.classList.contains("open"))); });
    });
    document.addEventListener("click", () => document.querySelectorAll(".dropdown").forEach((d) => d.classList.remove("open")));
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => document.getElementById(b.dataset.close).classList.remove("show")));

    const $ = (id) => document.getElementById(id);
    const fillSel = (el, list, all) => { el.innerHTML = `<option value="">${all}</option>` + list.map((x) => `<option value="${x.id}">${x.name}</option>`).join(""); };
    fillSel($("fDept"), CRM.dicts.depts, "请选择");
    fillSel($("fPost"), CRM.dicts.hrPosts, "请选择");
    fillSel($("fStatus"), CRM.dicts.hrStatuses, "请选择");
    fillSel($("e_gender"), CRM.dicts.hrGenders, "请选择");
    fillSel($("e_dept"), CRM.dicts.depts, "请选择");
    fillSel($("e_post"), CRM.dicts.hrPosts, "请选择");
    fillSel($("e_edu"), CRM.dicts.hrEdu, "请选择");
    fillSel($("e_status"), CRM.dicts.hrStatuses, "请选择");
    fillSel($("r_post"), CRM.dicts.hrPosts, "请选择");

    let list = CRM.loadStaff();
    let page = 1;
    const pageSize = 10;
    let query = {};
    let editingId = null;

    const tag = (st) => `<span class="tag st-${st}">${CRM.dictName("hrStatuses", st)}</span>`;
    const renderKpi = () => {
      const s = CRM.staffStats(list);
      $("kpis").innerHTML = `
        <div class="kpi"><div class="kpi-label">在职人数</div><div class="kpi-val">${s.live}<span class="u">人</span></div><div class="kpi-sub">本月入职 ${s.monthIn} 人</div></div>
        <div class="kpi green"><div class="kpi-label">试用期</div><div class="kpi-val">${s.probation}<span class="u">人</span></div><div class="kpi-sub">待转正 ${s.waitConvert} 人</div></div>
        <div class="kpi orange"><div class="kpi-label">合同即将到期</div><div class="kpi-val">${s.expiring}<span class="u">人</span></div><div class="kpi-sub">30天内 ${s.in30} 人</div></div>
        <div class="kpi red"><div class="kpi-label">本月离职</div><div class="kpi-val">${s.monthLeft}<span class="u">人</span></div><div class="kpi-sub">本年累计 ${s.yearLeft} 人</div></div>`;
    };

    const filtered = () => list.filter((s) => {
      if (query.name && !(s.name || "").includes(query.name) && !(s.no || "").includes(query.name)) return false;
      if (query.deptId && s.deptId !== query.deptId) return false;
      if (query.postId && s.postId !== query.postId) return false;
      if (query.status && s.statusId !== query.status) return false;
      const ent = (s.entryAt || "").slice(0, 10);
      if (query.from && ent < query.from) return false;
      if (query.to && ent > query.to) return false;
      return true;
    });

    const render = () => {
      renderKpi();
      const rows = filtered();
      const pages = Math.max(1, Math.ceil(rows.length / pageSize));
      if (page > pages) page = pages;
      $("pageInfo").textContent = `共 ${rows.length} 条`;
      $("tbody").innerHTML = rows.slice((page - 1) * pageSize, page * pageSize).map((s) => {
        const ops = [`<button data-act="edit" data-id="${s.id}" type="button">编辑</button>`];
        if (s.statusId === "probation") ops.push(`<button data-act="conv" data-id="${s.id}" type="button">转正</button>`);
        if (s.statusId === "expiring") ops.push(`<button data-act="renew" data-id="${s.id}" type="button">续签</button>`);
        return `<tr>
          <td>${s.no}</td><td>${s.name}</td><td>${CRM.dictName("depts", s.deptId)}</td>
          <td>${CRM.dictName("hrPosts", s.postId)}</td><td>${s.entryAt || "—"}</td>
          <td>${s.convertAt || "—"}</td><td>${s.contractEnd || "—"}</td>
          <td>${CRM.maskPhone(s.phone)}</td><td>${CRM.dictName("hrEdu", s.eduId)}</td>
          <td>${tag(s.statusId)}</td><td class="ops">${ops.join("")}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="11">暂无员工档案</td></tr>`;
      $("pages").innerHTML = `<button type="button" data-p="${page - 1}" ${page <= 1 ? "disabled" : ""}>‹</button>` +
        Array.from({ length: pages }, (_, i) => `<button class="${i + 1 === page ? "on" : ""}" data-p="${i + 1}" type="button">${i + 1}</button>`).join("") +
        `<button type="button" data-p="${page + 1}" ${page >= pages ? "disabled" : ""}>›</button>`;
    };

    const persist = (row, extraLog) => {
      const prev = list.find((x) => x.id === row.id);
      if (extraLog) {
        row.logs = row.logs || [];
        row.logs.unshift(extraLog);
      }
      const i = list.findIndex((x) => x.id === row.id);
      if (i >= 0) list[i] = row; else list.push(row);
      CRM.applyStaffBiz(prev, row);
      CRM.saveStaff(list);
      list = CRM.loadStaff();
      render();
    };

    const openEdit = (id) => {
      const s = list.find((x) => x.id === id);
      if (!s) return;
      editingId = id;
      $("e_no").value = s.no;
      $("e_name").value = s.name;
      $("e_gender").value = s.genderId || "";
      $("e_dept").value = s.deptId || "";
      $("e_post").value = s.postId || "";
      $("e_phone").value = s.phone || "";
      $("e_entry").value = s.entryAt || "";
      $("e_convert").value = s.convertAt || "";
      $("e_end").value = s.contractEnd || "";
      $("e_edu").value = s.eduId || "";
      $("e_status").value = s.statusId || "";
      $("e_idno").value = s.idNo || "";
      $("e_em_name").value = s.emergName || "";
      $("e_em_phone").value = s.emergPhone || "";
      $("e_addr").value = s.address || "";
      $("e_remark").value = s.remark || "";
      $("editLinks").innerHTML = `
        <a href="reimbursements.html?person=${encodeURIComponent(s.name)}">查看报销</a>
        <a href="sales-performance.html?person=${encodeURIComponent(s.id)}">查看销售业绩</a>
        <a href="salary.html?person=${encodeURIComponent(s.id)}">查看薪资</a>
        <a href="marketing-goals.html?person=${encodeURIComponent(s.id)}">对照营销目标</a>
        <a href="employees.html?person=${encodeURIComponent(s.id)}">查看员工账号</a>`;
      $("editMask").classList.add("show");
    };

    $("btnSaveEdit").addEventListener("click", () => {
      const s = list.find((x) => x.id === editingId);
      if (!s) return;
      if (!$("e_name").value.trim()) { toast("请填写姓名"); return; }
      const next = {
        ...s,
        name: $("e_name").value.trim(),
        genderId: $("e_gender").value,
        deptId: $("e_dept").value,
        postId: $("e_post").value,
        phone: $("e_phone").value.trim(),
        entryAt: $("e_entry").value,
        convertAt: $("e_convert").value,
        contractEnd: $("e_end").value,
        eduId: $("e_edu").value,
        statusId: $("e_status").value || s.statusId,
        idNo: $("e_idno").value.trim(),
        emergName: $("e_em_name").value.trim(),
        emergPhone: $("e_em_phone").value.trim(),
        address: $("e_addr").value.trim(),
        remark: $("e_remark").value.trim()
      };
      if (next.statusId === "left" && !next.leftAt) next.leftAt = CRM.HR_ASOF;
      persist(next, { at: CRM.HR_ASOF + " 16:00", title: "档案更新", text: "编辑员工信息" });
      $("editMask").classList.remove("show");
      toast("已保存员工信息");
    });

    const openRenew = (id) => {
      const s = list.find((x) => x.id === id);
      if (!s || s.statusId !== "expiring") return;
      editingId = id;
      $("r_no").value = s.no;
      $("r_name").value = s.name;
      $("r_dept").value = CRM.dictName("depts", s.deptId);
      $("r_post").value = s.postId || "";
      $("r_old").value = s.contractEnd || "";
      $("r_end").value = CRM.addYMD(s.contractEnd || CRM.HR_ASOF, 1, 0, 0);
      $("r_remark").value = "";
      $("renewMask").classList.add("show");
    };
    $("btnSaveRenew").addEventListener("click", () => {
      const s = list.find((x) => x.id === editingId);
      if (!s) return;
      const end = $("r_end").value;
      if (!end) { toast("请选择续签后到期日"); return; }
      if (s.contractEnd && end <= s.contractEnd) { toast("续签到期日须晚于当前到期日"); return; }
      persist({
        ...s,
        postId: $("r_post").value || s.postId,
        contractEnd: end,
        statusId: "active"
      }, { at: CRM.HR_ASOF + " 16:10", title: "合同续签", text: ($("r_remark").value.trim() || "续签至") + " " + end });
      $("renewMask").classList.remove("show");
      toast("已续签劳动合同");
    });

    const openConv = (id) => {
      const s = list.find((x) => x.id === id);
      if (!s) return;
      editingId = id;
      $("c_no").value = s.no;
      $("c_name").value = s.name;
      $("c_dept").value = CRM.dictName("depts", s.deptId);
      $("c_post").value = CRM.dictName("hrPosts", s.postId);
      $("c_entry").value = s.entryAt || "";
      $("c_date").value = s.convertAt || CRM.HR_ASOF;
      $("c_remark").value = "";
      $("convMask").classList.add("show");
    };
    $("btnSaveConv").addEventListener("click", () => {
      const s = list.find((x) => x.id === editingId);
      if (!s) return;
      const d = $("c_date").value;
      if (!d) { toast("请选择转正日期"); return; }
      if (s.entryAt && d < s.entryAt) { toast("转正日期不能早于入职日期"); return; }
      persist({
        ...s,
        convertAt: d,
        statusId: "active",
        remark: $("c_remark").value.trim() || s.remark
      }, { at: d + " 10:00", title: "试用转正", text: $("c_remark").value.trim() || "试用期满，同意转正" });
      $("convMask").classList.remove("show");
      toast("已办理转正");
    });

    $("btnQuery").addEventListener("click", () => {
      query = { name: $("fName").value.trim(), deptId: $("fDept").value, postId: $("fPost").value, status: $("fStatus").value, from: $("fFrom").value, to: $("fTo").value };
      page = 1; render();
    });
    $("btnReset").addEventListener("click", () => {
      $("fName").value = $("fDept").value = $("fPost").value = $("fStatus").value = $("fFrom").value = $("fTo").value = "";
      query = {}; page = 1; render();
    });
    $("pages").addEventListener("click", (e) => {
      const b = e.target.closest("[data-p]");
      if (!b || b.disabled) return;
      const n = Number(b.dataset.p);
      if (n >= 1) { page = n; render(); }
    });
    $("tbody").addEventListener("click", (e) => {
      const b = e.target.closest("[data-id]");
      if (!b) return;
      if (b.dataset.act === "edit") openEdit(b.dataset.id);
      if (b.dataset.act === "renew") openRenew(b.dataset.id);
      if (b.dataset.act === "conv") openConv(b.dataset.id);
    });

    const qs = new URLSearchParams(location.search);
    if (qs.get("person")) {
      const p = CRM.person(qs.get("person")) || list.find((s) => s.name === qs.get("person") || s.id === qs.get("person"));
      if (p) { $("fName").value = p.name || qs.get("person"); query.name = $("fName").value; }
    }
    if (qs.get("dept")) { $("fDept").value = qs.get("dept"); query.deptId = qs.get("dept"); }
    if (qs.get("status")) { $("fStatus").value = qs.get("status"); query.status = qs.get("status"); }
    render();
  </script>
</body>
</html>
