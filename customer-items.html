<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户物品 - CRM</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <script src="js/auth.js"></script>
  <style>
    .top-actions { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 16px; }
    .toolbar { padding: 16px; }
    .filter-grid { display: grid; grid-template-columns: auto 1fr auto 1fr auto 1fr auto 1fr auto 1fr auto; gap: 10px 8px; align-items: center; }
    .filter-grid label { font-size: var(--fs-sm); color: var(--text); text-align: right; white-space: nowrap; }
    .filter-grid input, .filter-grid select { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .filter-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-md { height: 32px; padding: 0 14px; font-size: var(--fs-sm); }
    .list-card { overflow: auto; flex: 1; min-height: 360px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px 8px; text-align: left; border-top: 1px solid #f0f0f0; white-space: nowrap; }
    th { background: #fafafa; color: var(--text-secondary); font-weight: 600; }
    .note { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
    .ops { white-space: nowrap; }
    .ops button { border: 0; background: none; cursor: pointer; font-size: 12px; padding: 0 6px 0 0; }
    .link-out { color: var(--orange); }
    .link-back { color: var(--success); }
    .link-detail { color: var(--primary); }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--primary-soft); color: var(--primary); }
    .st { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .st-stock { background: #f6ffed; color: #389e0d; }
    .st-borrowed { background: #fff7e6; color: var(--orange); }
    .st-taken { background: #e6f4ff; color: var(--primary); }
    .st-lost { background: #fff1f0; color: var(--danger); }
    .pager-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: var(--fs-xs); color: var(--text-secondary); }
    .pager-right { display: flex; align-items: center; gap: 6px; }
    .pager-bar button { min-width: 24px; height: 24px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; }
    .pager-bar button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager-bar button:disabled { opacity: 0.45; cursor: default; }
    .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: center; justify-content: center; padding: 16px; }
    .mask.show { display: flex; }
    .modal { width: 760px; max-width: 100%; background: #fff; border-radius: var(--radius); max-height: calc(100vh - 24px); overflow: auto; }
    .modal.sm { width: 420px; }
    .modal-head { height: 44px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; font-weight: 600; }
    .modal-close { position: absolute; right: 12px; top: 0; bottom: 0; border: 0; background: none; color: #fff; font-size: 22px; cursor: pointer; }
    .modal-body { padding: 18px 22px 8px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 22px 20px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .field label { display: block; font-size: var(--fs-xs); color: var(--text); margin-bottom: 6px; }
    .field input, .field select, .field textarea { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .field textarea { height: 72px; padding: 8px; resize: vertical; }
    .ro { background: #f5f5f5 !important; }
    .full { grid-column: 1 / -1; }
    .field a { color: var(--primary); font-size: var(--fs-sm); }
    @media (max-width: 1200px) { .filter-grid { grid-template-columns: auto 1fr auto 1fr auto 1fr; } .filter-actions { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div class="toast-wrap" id="toasts"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">CRM</div>
      <nav class="nav">
        <a class="nav-item" href="workbench.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          工作台
        </a>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16l3-4 3 2 4-6"/></svg>销售中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="marketing-goals.html">营销目标</a>
            <a class="nav-item" href="leads.html">线索管理</a>
            <a class="nav-item" href="opportunities.html">商机管理</a>
            <a class="nav-item" href="contracts.html">合同管理</a>
            <a class="nav-item" href="customers.html">客户管理</a>
            <a class="nav-item" href="sales-performance.html">销售业绩</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M4 19c.5-3 2.8-5 5-5s4.5 2 5 5"/><path d="M16 8h5M18.5 5.5v5"/></svg>客户中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="gov-services.html">政务服务</a>
            <a class="nav-item" href="bookkeeping.html">代账服务</a>
            <a class="nav-item" href="addresses.html">地址管理</a>
            <a class="nav-item active" href="customer-items.html">客户物品</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>运营中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="reimbursements.html">财务报销</a>
            <a class="nav-item" href="reports.html">经营报表</a>
            <a class="nav-item" href="personnel.html">人事管理</a>
            <a class="nav-item" href="salary.html">薪资管理</a>
            <a class="nav-item" href="employees.html">员工管理</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>系统管理</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="roles.html">角色权限</a>
            <button class="nav-item" data-page="pending" type="button">字典管理</button>
            <button class="nav-item" data-page="pending" type="button">菜单管理</button>
          </div>
        </div>
      </nav>
    </aside>
    <div class="main">
      <header class="header">
        <div class="dropdown" id="mailDrop">
          <button class="icon-btn" type="button" data-toggle="mailDrop" aria-label="消息"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></button>
          <div class="dropdown-panel"><div class="empty">暂无新消息</div></div>
        </div>
        <button class="icon-btn soon" type="button" aria-label="帮助"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 17v-1M12 8a2.2 2.2 0 0 1 1 4c-.6.5-1 1-1 2"/></svg></button>
        <div class="dropdown" id="userDrop">
          <button class="user-chip" type="button" data-toggle="userDrop"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 19c1-4 3.5-6 7-6s6 2 7 6"/></svg>用户</button>
          <div class="dropdown-panel"><button type="button" class="soon">个人中心</button><button type="button" data-logout>退出登录</button></div>
        </div>
      </header>
      <main class="content">
        <div class="top-actions">
          <button class="btn btn-primary btn-md" id="btnAdd" type="button">+ 新增物品</button>
          <button class="btn btn-ghost btn-md soon" type="button">导出</button>
        </div>
        <section class="card toolbar">
          <div class="filter-grid">
            <label title="来源：客户/合同/线索公司名。去处：列表筛选、新增匹配。">客户名称</label><input id="fCust" placeholder="请输入客户名称" />
            <label title="来源：本页录入或合同入库。去处：列表筛选。">物品名称</label><input id="fName" placeholder="请输入物品名称" />
            <label title="来源：物品类型字典。去处：列表标签、新增。">物品类型</label><select id="fType"></select>
            <label title="来源：本页或地址库档案室编号。去处：筛选。">存放位置</label><input id="fLoc" placeholder="请输入存放位置" />
            <label title="来源：取出/归还/取回回写。去处：列表色标。">状态</label><select id="fStatus"></select>
            <div class="filter-actions">
              <button class="btn btn-primary btn-md" id="btnQuery" type="button">查询</button>
              <button class="btn btn-ghost btn-md" id="btnReset" type="button">重置</button>
            </div>
          </div>
        </section>
        <section class="card list-card">
          <table>
            <thead>
              <tr>
                <th>物品编号</th><th>客户名称</th><th>物品名称</th><th>物品类型</th><th>数量</th><th>单位</th>
                <th>存放位置</th><th>入库日期</th><th>状态</th><th>备注</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="pager-bar">
            <span id="pageInfo">共 0 条</span>
            <div class="pager-right" id="pages"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="mask" id="addMask">
    <div class="modal">
      <div class="modal-head"><span>新增客户物品</span><button class="modal-close" data-close="addMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two">
          <div class="field"><label>物品编号</label><input id="i_no" class="ro" disabled /></div>
          <div class="field"><label>客户名称</label><input id="i_cust" list="custList" placeholder="匹配客户库" /></div>
          <div class="field"><label>物品名称</label><input id="i_name" placeholder="请输入物品名称" /></div>
          <div class="field"><label>物品类型</label><select id="i_type"></select></div>
          <div class="field"><label>数量</label><input id="i_qty" type="number" min="1" placeholder="请输入数量" /></div>
          <div class="field"><label>单位</label><select id="i_unit"></select></div>
          <div class="field"><label>存放位置</label><input id="i_loc" list="locList" placeholder="请输入存放位置，如：档案室A-01" /></div>
          <div class="field"><label>入库日期</label><input id="i_in" type="date" /></div>
          <div class="field"><label>状态</label><select id="i_st"></select></div>
          <div class="field full"><label>备注</label><textarea id="i_note" placeholder="请输入备注信息（选填）"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="addMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="addOk" type="button">确认新增</button>
      </div>
    </div>
  </div>

  <div class="mask" id="outMask">
    <div class="modal sm">
      <div class="modal-head"><span id="outTitle">取出物品</span><button class="modal-close" data-close="outMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="field"><label>借用人</label><input id="o_who" list="peopleList" placeholder="匹配业务员" /></div>
        <div class="field" style="margin-top:12px"><label>说明</label><input id="o_why" placeholder="年检、外带开票等" /></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="outMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="outOk" type="button">确认取出</button>
      </div>
    </div>
  </div>

  <div class="mask" id="viewMask">
    <div class="modal">
      <div class="modal-head"><span>物品详情</span><button class="modal-close" data-close="viewMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two" id="viewGrid"></div>
        <div class="field full" style="margin-top:12px"><label>流转记录</label><div class="log" id="viewLog"></div></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" id="markTaken" type="button">标记取回</button>
        <button class="btn btn-ghost btn-md" id="markLost" type="button">标记遗失</button>
        <button class="btn btn-primary btn-md" data-close="viewMask" type="button">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/crm-store.js"></script>
  <script>
    const toast = (m) => { const el = document.createElement("div"); el.className = "toast"; el.textContent = m; document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 1800); };
    document.querySelectorAll(".nav-group-btn").forEach((b) => b.addEventListener("click", () => b.parentElement.classList.toggle("open")));
    document.querySelectorAll("[data-page=pending],.soon").forEach((el) => el.addEventListener("click", () => toast("功能即将开放")));
    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); document.querySelectorAll(".dropdown").forEach((d) => d.classList.toggle("open", d.id === btn.dataset.toggle && !d.classList.contains("open"))); });
    });
    document.addEventListener("click", () => document.querySelectorAll(".dropdown").forEach((d) => d.classList.remove("open")));
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => document.getElementById(b.dataset.close).classList.remove("show")));

    const $ = (id) => document.getElementById(id);
    const fillSel = (el, list, all) => { el.innerHTML = `<option value="">${all}</option>` + list.map((x) => `<option value="${x.id}">${x.name}</option>`).join(""); };
    fillSel($("fType"), CRM.dicts.itemTypes, "请选择");
    fillSel($("fStatus"), CRM.dicts.itemStatuses, "请选择");
    fillSel($("i_type"), CRM.dicts.itemTypes, "请选择");
    fillSel($("i_unit"), CRM.dicts.itemUnits, "请选择");
    fillSel($("i_st"), CRM.dicts.itemStatuses, "请选择");

    const custNames = () => {
      const s = new Set(CRM.customerOptions("old").map((c) => c.name));
      list.forEach((x) => { if (x.customerName) s.add(x.customerName); });
      CRM.loadCustomers().forEach((c) => { if (c.name) s.add(c.name); });
      CRM.loadContracts().forEach((c) => { if (c.customerName) s.add(c.customerName); });
      return [...s];
    };
    const refreshCust = () => {
      $("custList").innerHTML = custNames().map((n) => `<option value="${n}"></option>`).join("");
    };
    const dlC = document.createElement("datalist");
    dlC.id = "custList";
    document.body.appendChild(dlC);
    const dlP = document.createElement("datalist");
    dlP.id = "peopleList";
    dlP.innerHTML = CRM.dicts.people.map((p) => `<option value="${p.name}"></option>`).join("");
    document.body.appendChild(dlP);

    let list = CRM.loadItems();
    const locOptions = () => {
      const set = new Set(list.map((x) => x.location).filter(Boolean));
      CRM.loadAddresses().filter((a) => a.statusId !== "off").forEach((a) => { set.add("档案室-" + a.no); set.add("保险柜-" + a.name); });
      return [...set];
    };
    const refreshLoc = () => {
      let dl = document.getElementById("locList");
      if (!dl) { dl = document.createElement("datalist"); dl.id = "locList"; document.body.appendChild(dl); }
      dl.innerHTML = locOptions().map((x) => `<option value="${x}"></option>`).join("");
    };
    refreshLoc();
    refreshCust();

    let page = 1;
    const pageSize = 10;
    let query = {};
    let outId = null;
    let viewId = null;

    const filtered = () => list.filter((x) => {
      if (query.cust && !(x.customerName || "").includes(query.cust)) return false;
      if (query.name && !(x.name || "").includes(query.name)) return false;
      if (query.type && x.typeId !== query.type) return false;
      if (query.loc && !(x.location || "").includes(query.loc)) return false;
      if (query.status && x.statusId !== query.status) return false;
      return true;
    });

    const opsOf = (x) => {
      const bits = [];
      if (x.statusId === "stock") bits.push(`<button class="link-out" data-act="out" data-id="${x.id}" type="button">取出</button>`);
      if (x.statusId === "borrowed") bits.push(`<button class="link-back" data-act="back" data-id="${x.id}" type="button">归还</button>`);
      bits.push(`<button class="link-detail" data-act="view" data-id="${x.id}" type="button">详情</button>`);
      return bits.join("");
    };

    const render = () => {
      const rows = filtered();
      const pages = Math.max(1, Math.ceil(rows.length / pageSize));
      if (page > pages) page = pages;
      $("pageInfo").textContent = `共 ${rows.length} 条`;
      $("tbody").innerHTML = rows.slice((page - 1) * pageSize, page * pageSize).map((x) => `<tr>
        <td>${x.no}</td>
        <td>${x.customerName || "—"}</td>
        <td>${x.name || "—"}</td>
        <td><span class="tag">${CRM.dictName("itemTypes", x.typeId)}</span></td>
        <td>${x.qty || 0}</td>
        <td>${CRM.dictName("itemUnits", x.unitId)}</td>
        <td>${x.location || "—"}</td>
        <td>${x.inAt || "—"}</td>
        <td><span class="st st-${x.statusId}">${CRM.dictName("itemStatuses", x.statusId)}</span></td>
        <td class="note" title="${x.remark || ""}">${x.remark || "—"}</td>
        <td class="ops">${opsOf(x)}</td>
      </tr>`).join("") || `<tr><td colspan="11">暂无物品</td></tr>`;
      const prev = page <= 1 ? "disabled" : "";
      const next = page >= pages ? "disabled" : "";
      $("pages").innerHTML = `<button type="button" data-p="${page - 1}" ${prev}>‹</button>` +
        Array.from({ length: pages }, (_, i) => `<button class="${i + 1 === page ? "on" : ""}" data-p="${i + 1}" type="button">${i + 1}</button>`).join("") +
        `<button type="button" data-p="${page + 1}" ${next}>›</button>`;
    };

    const persist = () => { CRM.saveItems(list); refreshLoc(); render(); };

    const openAdd = () => {
      $("i_no").value = CRM.nextItemNo(list);
      $("i_cust").value = $("fCust").value || "";
      $("i_name").value = $("i_loc").value = $("i_note").value = "";
      $("i_type").value = $("i_unit").value = "";
      $("i_qty").value = "1";
      $("i_st").value = "stock";
      const today = "2026-08-31";
      $("i_in").min = "2026-08-01";
      $("i_in").value = today;
      $("addMask").classList.add("show");
    };

    $("btnAdd").addEventListener("click", openAdd);
    $("addOk").addEventListener("click", () => {
      const customerName = $("i_cust").value.trim();
      const name = $("i_name").value.trim();
      const typeId = $("i_type").value;
      const unitId = $("i_unit").value;
      const qty = Number($("i_qty").value || 0);
      const location = $("i_loc").value.trim();
      const inAt = $("i_in").value;
      if (!customerName || !name || !typeId || !unitId) { toast("请填写客户、物品名称、类型和单位"); return; }
      if (!(qty > 0)) { toast("请填写数量"); return; }
      if (!location || !inAt) { toast("请填写存放位置和入库日期"); return; }
      if (!custNames().includes(customerName)) { toast("请从客户库匹配客户名称"); return; }
      list.push({
        id: "it-" + Date.now(),
        no: $("i_no").value,
        customerName, name, typeId, qty, unitId, location, inAt,
        statusId: $("i_st").value || "stock",
        remark: $("i_note").value.trim(),
        logs: [{ at: inAt, text: "手工入库" }]
      });
      $("addMask").classList.remove("show");
      persist();
      refreshCust();
      toast("物品已入库");
    });

    const hit = (id) => list.find((x) => x.id === id);

    $("tbody").addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      const row = hit(b.dataset.id);
      if (!row) return;
      if (b.dataset.act === "out") {
        outId = row.id;
        $("o_who").value = "";
        $("o_why").value = "";
        $("outMask").classList.add("show");
      }
      if (b.dataset.act === "back") {
        row.statusId = "stock";
        row.logs = row.logs || [];
        row.logs.push({ at: "2026-08-31", text: "归还入库" });
        CRM.recordItemMove(row, "已归还入库");
        persist();
        toast("已归还，状态为在存");
      }
      if (b.dataset.act === "view") {
        viewId = row.id;
        $("viewGrid").innerHTML = [
          ["物品编号", row.no, ""],
          ["客户名称", row.customerName, `customers.html?name=${encodeURIComponent(row.customerName || "")}`],
          ["物品名称", row.name, ""],
          ["物品类型", CRM.dictName("itemTypes", row.typeId), ""],
          ["数量", row.qty, ""],
          ["单位", CRM.dictName("itemUnits", row.unitId), ""],
          ["存放位置", row.location, ""],
          ["入库日期", row.inAt, ""],
          ["状态", CRM.dictName("itemStatuses", row.statusId), ""],
          ["关联合同", row.contractNo || "—", row.contractNo ? `contracts.html?no=${encodeURIComponent(row.contractNo)}` : ""],
          ["备注", row.remark || "—", ""]
        ].map(([k, v, href]) => `<div class="field"><label>${k}</label>${href ? `<a href="${href}">${v}</a>` : `<input class="ro" disabled value="${v}" />`}</div>`).join("");
        $("viewLog").innerHTML = (row.logs || []).map((l) => `${l.at}　${l.text}`).join("<br>") || "暂无流转记录";
        $("viewMask").classList.add("show");
      }
    });

    $("outOk").addEventListener("click", () => {
      const row = hit(outId);
      if (!row) return;
      const who = $("o_who").value.trim();
      if (!who) { toast("请填写借用人"); return; }
      if (!CRM.dicts.people.some((p) => p.name === who)) { toast("借用人须匹配业务员"); return; }
      row.statusId = "borrowed";
      row.logs = row.logs || [];
      row.logs.push({ at: "2026-08-31", text: "取出，借用人：" + who + ($("o_why").value ? "，" + $("o_why").value : "") });
      CRM.recordItemMove(row, "取出，借用人：" + who);
      $("outMask").classList.remove("show");
      persist();
      toast("已取出，状态为已借出");
    });

    const mark = (statusId, text) => {
      const row = hit(viewId);
      if (!row) return;
      row.statusId = statusId;
      row.logs = row.logs || [];
      row.logs.push({ at: "2026-08-31", text });
      CRM.recordItemMove(row, text);
      $("viewMask").classList.remove("show");
      persist();
      toast(text);
    };
    $("markTaken").addEventListener("click", () => mark("taken", "客户取回"));
    $("markLost").addEventListener("click", () => mark("lost", "标记遗失"));

    $("btnQuery").addEventListener("click", () => {
      query = { cust: $("fCust").value.trim(), name: $("fName").value.trim(), type: $("fType").value, loc: $("fLoc").value.trim(), status: $("fStatus").value };
      page = 1; render();
    });
    $("btnReset").addEventListener("click", () => {
      $("fCust").value = $("fName").value = $("fType").value = $("fLoc").value = $("fStatus").value = "";
      query = {}; page = 1; render();
    });
    $("pages").addEventListener("click", (e) => {
      const b = e.target.closest("[data-p]");
      if (!b || b.disabled) return;
      const n = Number(b.dataset.p);
      if (n >= 1) { page = n; render(); }
    });

    const qs = new URLSearchParams(location.search);
    if (qs.get("customer")) { $("fCust").value = qs.get("customer"); query.cust = qs.get("customer"); }
    if (qs.get("add") === "1") openAdd();
    render();
  </script>
</body>
</html>
