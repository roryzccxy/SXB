<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地址管理 - CRM</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <script src="js/auth.js"></script>
  <style>
    .toolbar { padding: 16px; }
    .filter-grid { display: grid; grid-template-columns: auto 1fr auto 1fr auto 1fr auto 1fr auto; gap: 10px 8px; align-items: center; }
    .filter-grid label { font-size: var(--fs-sm); color: var(--text); text-align: right; white-space: nowrap; }
    .filter-grid input, .filter-grid select { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .filter-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-md { height: 32px; padding: 0 14px; font-size: var(--fs-sm); }
    .list-card { overflow: auto; flex: 1; min-height: 360px; }
    .list-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .list-head h3 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
    .list-head .count { color: var(--text-secondary); font-size: var(--fs-xs); font-weight: 400; margin-left: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px 8px; text-align: left; border-top: 1px solid #f0f0f0; white-space: nowrap; }
    th { background: #fafafa; color: var(--text-secondary); font-weight: 600; }
    .detail { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .link { border: 0; background: none; color: var(--primary); cursor: pointer; font-size: 12px; padding: 0; }
    .st { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid transparent; }
    .st-full { background: #fff1f0; color: var(--danger); border-color: #ffa39e; }
    .st-inuse { background: #e6f4ff; color: var(--primary); border-color: #91caff; }
    .st-idle { background: #fff; color: var(--text-secondary); border-color: #d9d9d9; }
    .st-off { background: #f5f5f5; color: #595959; border-color: #d9d9d9; }
    .pager-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: var(--fs-xs); color: var(--text-secondary); }
    .pager-right { display: flex; align-items: center; gap: 6px; }
    .pager-bar button { min-width: 24px; height: 24px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; }
    .pager-bar button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pager-bar button:disabled { opacity: 0.45; cursor: default; }
    .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: center; justify-content: center; padding: 16px; }
    .mask.show { display: flex; }
    .modal { width: 760px; max-width: 100%; background: #fff; border-radius: var(--radius); max-height: calc(100vh - 24px); overflow: auto; }
    .modal-head { height: 44px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; font-weight: 600; }
    .modal-close { position: absolute; right: 12px; top: 0; bottom: 0; border: 0; background: none; color: #fff; font-size: 22px; cursor: pointer; }
    .modal-body { padding: 18px 22px 8px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 12px 22px 20px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .field label { display: block; font-size: var(--fs-xs); color: var(--text); margin-bottom: 6px; }
    .field input, .field select, .field textarea { height: 32px; border: 1px solid #d9d9d9; border-radius: var(--radius-sm); padding: 0 10px; font-size: var(--fs-sm); width: 100%; background: #fff; }
    .field textarea { height: 72px; padding: 8px; resize: vertical; }
    .ro { background: #f5f5f5 !important; }
    .full { grid-column: 1 / -1; }
    .unit-wrap { position: relative; }
    .unit-wrap input { padding-right: 28px; }
    .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-secondary); }
    @media (max-width: 1100px) { .filter-grid { grid-template-columns: auto 1fr auto 1fr; } .filter-actions { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div class="toast-wrap" id="toasts"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">CRM</div>
      <nav class="nav">
        <a class="nav-item" href="workbench.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          工作台
        </a>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16l3-4 3 2 4-6"/></svg>销售中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="marketing-goals.html">营销目标</a>
            <a class="nav-item" href="leads.html">线索管理</a>
            <a class="nav-item" href="opportunities.html">商机管理</a>
            <a class="nav-item" href="contracts.html">合同管理</a>
            <a class="nav-item" href="customers.html">客户管理</a>
            <a class="nav-item" href="sales-performance.html">销售业绩</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M4 19c.5-3 2.8-5 5-5s4.5 2 5 5"/><path d="M16 8h5M18.5 5.5v5"/></svg>客户中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <button class="nav-item" data-page="pending" type="button">政务服务</button>
            <button class="nav-item" data-page="pending" type="button">代账服务</button>
            <a class="nav-item active" href="addresses.html">地址管理</a>
            <a class="nav-item" href="customer-items.html">客户物品</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>运营中心</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="reimbursements.html">财务报销</a>
            <a class="nav-item" href="reports.html">经营报表</a>
            <a class="nav-item" href="personnel.html">人事管理</a>
            <a class="nav-item" href="salary.html">薪资管理</a>
            <a class="nav-item" href="employees.html">员工管理</a>
          </div>
        </div>
        <div class="nav-group open">
          <button class="nav-group-btn" type="button"><span class="left"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>系统管理</span><svg class="chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <div class="nav-sub">
            <a class="nav-item" href="roles.html">角色权限</a>
            <button class="nav-item" data-page="pending" type="button">字典管理</button>
            <button class="nav-item" data-page="pending" type="button">菜单管理</button>
          </div>
        </div>
      </nav>
    </aside>
    <div class="main">
      <header class="header">
        <div class="dropdown" id="mailDrop">
          <button class="icon-btn" type="button" data-toggle="mailDrop" aria-label="消息"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></button>
          <div class="dropdown-panel"><div class="empty">暂无新消息</div></div>
        </div>
        <button class="icon-btn soon" type="button" aria-label="帮助"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 17v-1M12 8a2.2 2.2 0 0 1 1 4c-.6.5-1 1-1 2"/></svg></button>
        <div class="dropdown" id="userDrop">
          <button class="user-chip" type="button" data-toggle="userDrop"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 19c1-4 3.5-6 7-6s6 2 7 6"/></svg>用户</button>
          <div class="dropdown-panel"><button type="button" class="soon">个人中心</button><button type="button" data-logout>退出登录</button></div>
        </div>
      </header>
      <main class="content">
        <section class="card toolbar">
          <div class="filter-grid">
            <label title="来源：本页录入。去处：列表筛选。">地址名称</label><input id="fName" placeholder="请输入" />
            <label title="来源：区域字典（与线索相同）。去处：列表、弹窗。">所属区域</label><select id="fRegion"></select>
            <label title="来源：地址类型字典。去处：列表、弹窗、注册地址合同匹配。">地址类型</label><select id="fType"></select>
            <label title="来源：使用率自动计算，停用可手选。去处：列表标签、合同可选地址。">状态</label><select id="fStatus"></select>
            <div class="filter-actions">
              <button class="btn btn-primary btn-md" id="btnQuery" type="button">查询</button>
              <button class="btn btn-ghost btn-md" id="btnReset" type="button">重置</button>
              <button class="btn btn-ghost btn-md soon" type="button">导出</button>
              <button class="btn btn-primary btn-md" id="btnAdd" type="button">+ 新增地址</button>
            </div>
          </div>
        </section>
        <section class="card list-card">
          <div class="list-head">
            <h3>地址列表</h3>
            <span class="count" id="listCount">共 0 条</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>地址编号</th><th>地址名称</th><th>所属区域</th><th>地址类型</th><th>详细地址</th>
                <th>可用面积(㎡)</th><th>已用面积(㎡)</th><th>使用率</th><th>状态</th><th>负责人</th><th>联系电话</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="pager-bar">
            <span id="pageInfo">共 0 条，每页 10 条</span>
            <div class="pager-right" id="pages"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="mask" id="adMask">
    <div class="modal">
      <div class="modal-head"><span id="adTitle">新增地址</span><button class="modal-close" data-close="adMask" type="button">×</button></div>
      <div class="modal-body">
        <div class="two">
          <div class="field"><label>地址编号</label><input id="a_no" class="ro" disabled /></div>
          <div class="field"><label>地址名称</label><input id="a_name" placeholder="请输入地址名称" /></div>
          <div class="field"><label>所属区域</label><select id="a_region"></select></div>
          <div class="field"><label>地址类型</label><select id="a_type"></select></div>
          <div class="field"><label>可用面积</label><div class="unit-wrap"><input id="a_area" type="number" min="0" placeholder="请输入可用面积" /><span class="unit">㎡</span></div></div>
          <div class="field" id="usedWrap"><label>已用面积</label><div class="unit-wrap"><input id="a_used" type="number" min="0" /><span class="unit">㎡</span></div></div>
          <div class="field"><label>负责人</label><input id="a_owner" list="peopleList" placeholder="匹配业务员" /></div>
          <div class="field"><label>联系电话</label><input id="a_phone" placeholder="请输入联系电话" /></div>
          <div class="field" id="stWrap"><label>状态</label><select id="a_status"></select></div>
          <div class="field full"><label>详细地址</label><textarea id="a_detail" placeholder="请输入详细地址"></textarea></div>
          <div class="field full"><label>备注</label><textarea id="a_note" placeholder="请输入备注信息（选填）"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-md" data-close="adMask" type="button">取消</button>
        <button class="btn btn-primary btn-md" id="adOk" type="button">确认新增</button>
      </div>
    </div>
  </div>

  <script src="js/crm-store.js"></script>
  <script>
    const toast = (m) => { const el = document.createElement("div"); el.className = "toast"; el.textContent = m; document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 1800); };
    document.querySelectorAll(".nav-group-btn").forEach((b) => b.addEventListener("click", () => b.parentElement.classList.toggle("open")));
    document.querySelectorAll("[data-page=pending],.soon").forEach((el) => el.addEventListener("click", () => toast("功能即将开放")));
    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); document.querySelectorAll(".dropdown").forEach((d) => d.classList.toggle("open", d.id === btn.dataset.toggle && !d.classList.contains("open"))); });
    });
    document.addEventListener("click", () => document.querySelectorAll(".dropdown").forEach((d) => d.classList.remove("open")));
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => document.getElementById(b.dataset.close).classList.remove("show")));

    const $ = (id) => document.getElementById(id);
    const fillSel = (el, list, all) => { el.innerHTML = `<option value="">${all}</option>` + list.map((x) => `<option value="${x.id}">${x.name}</option>`).join(""); };
    fillSel($("fRegion"), CRM.dicts.regions, "请选择");
    fillSel($("fType"), CRM.dicts.addressTypes, "请选择");
    fillSel($("fStatus"), CRM.dicts.addressStatuses, "请选择");
    fillSel($("a_region"), CRM.dicts.regions, "请选择");
    fillSel($("a_type"), CRM.dicts.addressTypes, "请选择");
    fillSel($("a_status"), CRM.dicts.addressStatuses, "请选择");
    const dl = document.createElement("datalist");
    dl.id = "peopleList";
    dl.innerHTML = CRM.dicts.people.map((p) => `<option value="${p.name}"></option>`).join("");
    document.body.appendChild(dl);

    let list = CRM.loadAddresses();
    let page = 1;
    const pageSize = 10;
    let query = {};
    let mode = "create";
    let editingId = null;

    const ownerOf = (name) => CRM.dicts.people.find((p) => p.name === name);
    const ownerPhone = (personId) => {
      const hit = list.find((a) => a.ownerId === personId && a.phone);
      if (hit) return hit.phone;
      const lead = CRM.loadLeads().find((l) => l.ownerId === personId && l.phone);
      if (lead) return lead.phone;
      const cu = CRM.loadCustomers().find((c) => c.ownerId === personId && c.phone);
      return cu ? cu.phone : "";
    };
    const rateOf = (a) => {
      const area = Number(a.area || 0);
      const used = Number(a.usedArea || 0);
      return area ? Math.round((used / area) * 1000) / 10 : 0;
    };

    const filtered = () => list.filter((a) => {
      if (query.name && !(a.name || "").includes(query.name)) return false;
      if (query.region && a.regionId !== query.region) return false;
      if (query.type && a.typeId !== query.type) return false;
      if (query.status && a.statusId !== query.status) return false;
      return true;
    });

    const render = () => {
      const rows = filtered();
      const pages = Math.max(1, Math.ceil(rows.length / pageSize));
      if (page > pages) page = pages;
      $("listCount").textContent = `共 ${rows.length} 条`;
      $("pageInfo").textContent = `共 ${rows.length} 条，每页 ${pageSize} 条`;
      $("tbody").innerHTML = rows.slice((page - 1) * pageSize, page * pageSize).map((a) => `<tr>
        <td>${a.no}</td>
        <td>${a.name || "—"}</td>
        <td>${CRM.dictName("regions", a.regionId)}</td>
        <td>${CRM.dictName("addressTypes", a.typeId)}</td>
        <td class="detail" title="${a.detail || ""}">${a.detail || "—"}</td>
        <td>${a.area || 0}</td>
        <td>${a.usedArea || 0}</td>
        <td>${rateOf(a)}%</td>
        <td><span class="st st-${a.statusId}">${CRM.dictName("addressStatuses", a.statusId)}</span></td>
        <td>${(CRM.person(a.ownerId) || {}).name || "—"}</td>
        <td>${a.phone || "—"}</td>
        <td><button class="link" data-id="${a.id}" type="button">编辑</button></td>
      </tr>`).join("") || `<tr><td colspan="12">暂无地址</td></tr>`;
      const prev = page <= 1 ? "disabled" : "";
      const next = page >= pages ? "disabled" : "";
      $("pages").innerHTML = `<button type="button" data-p="${page - 1}" ${prev}>‹</button>` +
        Array.from({ length: pages }, (_, i) => `<button class="${i + 1 === page ? "on" : ""}" data-p="${i + 1}" type="button">${i + 1}</button>`).join("") +
        `<button type="button" data-p="${page + 1}" ${next}>›</button>`;
    };

    const openCreate = () => {
      mode = "create"; editingId = null;
      $("adTitle").textContent = "新增地址";
      $("adOk").textContent = "确认新增";
      $("usedWrap").hidden = true;
      $("a_no").value = CRM.nextAddressNo(list);
      $("a_name").value = $("a_owner").value = $("a_phone").value = $("a_detail").value = $("a_note").value = "";
      $("a_region").value = $("a_type").value = $("a_status").value = "";
      $("a_area").value = "";
      $("a_used").value = "0";
      $("a_status").value = "idle";
      $("adMask").classList.add("show");
    };
    const openEdit = (id) => {
      const a = list.find((x) => x.id === id);
      if (!a) return;
      mode = "edit"; editingId = id;
      $("adTitle").textContent = "编辑地址信息";
      $("adOk").textContent = "保存";
      $("usedWrap").hidden = false;
      $("a_no").value = a.no;
      $("a_name").value = a.name || "";
      $("a_region").value = a.regionId || "";
      $("a_type").value = a.typeId || "";
      $("a_area").value = a.area || "";
      $("a_used").value = a.usedArea || 0;
      $("a_owner").value = (CRM.person(a.ownerId) || {}).name || "";
      $("a_phone").value = a.phone || "";
      $("a_status").value = a.statusId || "idle";
      $("a_detail").value = a.detail || "";
      $("a_note").value = a.remark || "";
      $("adMask").classList.add("show");
    };

    $("a_owner").addEventListener("change", () => {
      const p = ownerOf($("a_owner").value.trim());
      if (p) $("a_phone").value = ownerPhone(p.id) || $("a_phone").value;
    });

    $("adOk").addEventListener("click", () => {
      const name = $("a_name").value.trim();
      const regionId = $("a_region").value;
      const typeId = $("a_type").value;
      const area = Number($("a_area").value || 0);
      let used = mode === "edit" ? Number($("a_used").value || 0) : 0;
      if (!name || !regionId || !typeId) { toast("请填写地址名称、区域和类型"); return; }
      if (!(area > 0)) { toast("请填写可用面积"); return; }
      if (used > area) { toast("已用面积不能大于可用面积"); return; }
      const p = ownerOf($("a_owner").value.trim());
      const row = {
        no: $("a_no").value,
        name,
        regionId,
        typeId,
        detail: $("a_detail").value.trim(),
        area,
        usedArea: used,
        ownerId: p ? p.id : "",
        phone: $("a_phone").value.trim(),
        remark: $("a_note").value.trim(),
        statusId: $("a_status").value || "idle"
      };
      if (row.statusId !== "off") row.statusId = CRM.autoAddrStatus(row);
      if (mode === "create") {
        list.push({ id: "ad-" + Date.now(), ...row });
        toast("地址已新增，注册地址合同可选该地址");
      } else {
        const i = list.findIndex((x) => x.id === editingId);
        if (i >= 0) list[i] = { ...list[i], ...row };
        toast("地址已保存");
      }
      CRM.saveAddresses(list);
      $("adMask").classList.remove("show");
      render();
    });

    $("btnAdd").addEventListener("click", openCreate);
    $("btnQuery").addEventListener("click", () => {
      query = { name: $("fName").value.trim(), region: $("fRegion").value, type: $("fType").value, status: $("fStatus").value };
      page = 1; render();
    });
    $("btnReset").addEventListener("click", () => {
      $("fName").value = $("fRegion").value = $("fType").value = $("fStatus").value = "";
      query = {}; page = 1; render();
    });
    $("pages").addEventListener("click", (e) => {
      const b = e.target.closest("[data-p]");
      if (!b || b.disabled) return;
      const n = Number(b.dataset.p);
      if (n >= 1) { page = n; render(); }
    });
    $("tbody").addEventListener("click", (e) => {
      const b = e.target.closest("[data-id]");
      if (b) openEdit(b.dataset.id);
    });

    const qs = new URLSearchParams(location.search);
    if (qs.get("region")) { $("fRegion").value = qs.get("region"); query.region = qs.get("region"); }
    if (qs.get("add") === "1") openCreate();
    render();
  </script>
</body>
</html>
